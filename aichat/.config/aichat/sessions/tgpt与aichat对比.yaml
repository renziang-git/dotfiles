  content: "啊，明白了！你想要的是 **左右分屏的终端聊天界面**，类似这样：\n\n```\n┌────────────────────────────────────────────────────┐\n│  文件列表(左)          │  聊天对话(右)            │\n│                        │                          │\n│  src/main.rs          │  User: 分析这个项目      │\n│  src/lib.rs           │                          │\n│  src/parser.rs        │  AI: 这个项目是一个...    │\n│  Cargo.toml           │                          │\n│  README.md            │                          │\n│                        │                          │\n│  [选中文件会同步]      │  [实时流式输出]         │\n└────────────────────────────────────────────────────┘\n```\n\n## 实现方案\n\n### 方案1：使用 `aichat` + `tmux` 分屏（最快实现）\n\n```bash\n# 安装 tmux\nsudo apt install tmux\n\n# 创建一个 tmux 分屏会话\ntmux new-session -d -s ai-gpt \\\n  -n 'AIChat' 'watch -n 5 \"git -C /home/r.za/git ls-files | head -20\"' \\; \\\n  split-window -h 'aichat --rag my-project --model deepseek-chat'\n\n# 附加到会话\ntmux attach -t ai-gpt\n```\n\n### 方案2：使用 Textual（Python TUI 框架）- **推荐**\n\n创建一个自定义的分屏聊天程序 `ai_split.py`：\n\n```python\n#!/usr/bin/env python3\n\"\"\"\n左右分屏 AI 聊天终端\n左：文件浏览器 | 右：聊天界面\n\"\"\"\n\nfrom textual import on\nfrom textual.app import App, ComposeResult\nfrom textual.widgets import Header, Footer, Tree, RichLog, Input, TextLog\nfrom textual.containers import Horizontal, Vertical\nfrom textual.reactive import reactive\nimport subprocess\nimport os\n\nclass FileExplorer(Tree):\n    \"\"\"文件树浏览器\"\"\"\n    \n    def on_mount(self) -> None:\n        self.load_file_tree(\"/home/r.za/git\")\n        self.root.expand()\n    \n    def load_file_tree(self, path):\n        \"\"\"加载 git 仓库文件树\"\"\"\n        self.root = self.root.add(\"git (root)\")\n        \n        # 获取 git 跟踪的文件\n        try:\n            result = subprocess.run(\n                [\"git\", \"-C\", path, \"ls-files\"],\n                capture_output=True, text=True\n            )\n            files = result.stdout.strip().split('\\n')\n            \n            for file_path in files[:50]:  # 限制前50个文件\n                if file_path:\n                    parts = file_path.split('/')\n                    current = self.root\n                    for part in parts:\n                        # 检查是否已存在\n                        existing = [c for c in current.children if c.label == part]\n                        if existing:\n                            current = existing[0]\n                        else:\n                            if part == parts[-1]:\n                                current = current.add_leaf(part)\n                            else:\n                                current = current.add(part)\n        except:\n            self.root.add_leaf(\"无法加载文件列表\")\n\nclass ChatPanel(TextLog):\n    \"\"\"聊天面板\"\"\"\n    \n    messages = reactive([])\n    \n    def add_message(self, role, content):\n        \"\"\"添加消息\"\"\"\n        self.write(f\"[bold]{role}:[/bold] {content}\")\n\nclass AIChatApp(App):\n    \"\"\"主应用\"\"\"\n    \n    CSS = \"\"\"\n    Screen {\n        background: $surface;\n    }\n    \n    Horizontal {\n        height: 1fr;\n    }\n    \n    #file-panel {\n        width: 30%;\n        border: solid $primary;\n        padding: 1;\n    }\n    \n    #chat-panel {\n        width: 70%;\n        border: solid $accent;\n        padding: 1;\n    }\n    \n    #input-panel {\n        height: 3;\n        border: solid $secondary;\n    }\n    \n    Tree {\n        height: 1fr;\n    }\n    \n    RichLog, TextLog {\n        height: 1fr;\n    }\n    \n    Input {\n        height: 3;\n    }\n    \"\"\"\n    \n    def compose(self) -> ComposeResult:\n        yield Header()\n        \n        with Horizontal():\n            with Vertical(id=\"file-panel\"):\n                yield FileExplorer(label=\"Files\")\n            \n            with Vertical(id=\"chat-panel\"):\n                yield ChatPanel(id=\"chat-display\")\n        \n        with Horizontal(id=\"input-panel\"):\n            yield Input(placeholder=\"输入消息 (Ctrl+S 发送)...\")\n        \n        yield Footer()\n    \n    @on(Input.Submitted)\n    def send_message(self, event):\n        \"\"\"发送消息给 AI\"\"\"\n        input_widget = self.query_one(Input)\n        message = input_widget.value.strip()\n        \n        if message:\n            chat_display = self.query_one(\"#chat-display\")\n            chat_display.add_message(\"You\", message)\n            \n            # 获取选中的文件\n            selected_files = self.get_selected_files()\n            \n            # 调用 aichat 命令\n            if selected_files:\n                cmd = [\"aichat\", \"--model\", \"deepseek-chat\", message]\n                for f in selected_files:\n                    cmd.extend([\"-f\", f])\n            else:\n                cmd = [\"aichat\", \"--model\", \"deepseek-chat\", message]\n            \n            # 异步执行 AI 调用\n            self.run_ai_command(cmd, chat_display)\n            \n            input_widget.value = \"\"\n    \n    def get_selected_files(self):\n        \"\"\"获取选中的文件路径\"\"\"\n        tree = self.query_one(FileExplorer)\n        selected = tree.cursor_node\n        if selected and selected.parent:\n            # 构建完整路径\n            path_parts = []\n            node = selected\n            while node.parent:\n                path_parts.insert(0, node.label)\n                node = node.parent\n            if path_parts:\n                full_path = os.path.join(\"/home/r.za/git\", *path_parts)\n                if os.path.isfile(full_path):\n                    return [full_path]\n        return []\n    \n    async def run_ai_command(self, cmd, chat_display):\n        \"\"\"异步执行 AI 命令\"\"\"\n        try:\n            process = await asyncio.create_subprocess_exec(\n                *cmd,\n                stdout=asyncio.subprocess.PIPE,\n                stderr=asyncio.subprocess.PIPE\n            )\n            \n            # 流式读取输出\n            async for line in process.stdout:\n                chat_display.add_message(\"AI\", line.decode().strip())\n            \n            await process.wait()\n        except Exception as e:\n            chat_display.add_message(\"Error\", str(e))\n\nif __name__ == \"__main__\":\n    AIChatApp().run()\n```\n\n### 方案3：使用 Go 重写（更好的性能）\n\n创建 `ai-tui/main.go`：\n\n```go\npackage main\n\nimport (\n    \"fmt\"\n    \"strings\"\n    \"os/exec\"\n    \"tea\" // Bubble Tea TUI 框架\n)\n\ntype model struct {\n    files    []string\n    messages []chatMessage\n    cursor   int\n    loading  bool\n}\n\ntype chatMessage struct {\n    role    string\n    content string\n}\n\nfunc (m model) Init() tea.Cmd {\n    return m.loadFiles()\n}\n\nfunc (m model) loadFiles() tea.Cmd {\n    return func() tea.Msg {\n        cmd := exec.Command(\"git\", \"-C\", \"/home/r.za/git\", \"ls-files\")\n        out, _ := cmd.Output()\n        files := strings.Split(strings.TrimSpace(string(out)), \"\\n\")\n        return filesMsg(files)\n    }\n}\n\nfunc (m model) View() string {\n    // 左面板：文件列表\n    leftPanel := \"📁 Files\\n\" + strings.Repeat(\"─\", 20) + \"\\n\"\n    for i, f := range m.files {\n        cursor := \" \"\n        if i == m.cursor {\n            cursor = \">\"\n        }\n        leftPanel += fmt.Sprintf(\" %s %s\\n\", cursor, f)\n    }\n    \n    // 右面板：聊天区域\n    rightPanel := \"💬 Chat\\n\" + strings.Repeat(\"─\", 40) + \"\\n\"\n    for _, msg := range m.messages {\n        rightPanel += fmt.Sprintf(\"[%s] %s\\n\", msg.role, msg.content)\n    }\n    \n    // 使用 Bubble Tea 的分屏布局\n    return tea.JoinHorizontal(\n        tea.Pad(leftPanel, 0, 1),\n        tea.Pad(rightPanel, 0, 1),\n    )\n}\n```\n\n### 方案4：使用现成的工具组合\n\n```bash\n# 使用 tmux + aichat + fzf\n# 创建一个脚本 aichat_split.sh\n\n#!/bin/bash\n\n# 创建 tmux 分屏\ntmux new-session -d -s aichat\n\n# 左面板：fzf 文件选择器\ntmux send-keys -t aichat.0 \"cd /home/r.za/git && \\\n  echo '按 ESC 退出 | Enter 选择文件发送给 AI' && \\\n  fzf --preview 'cat {}' --height 100%\" Enter\n\n# 右面板：aichat 聊天\ntmux split-window -h -t aichat.0\ntmux send-keys -t aichat.1 \"aichat --model deepseek-chat\" Enter\n\n# 附加到会话\ntmux attach -t aichat\n```\n\n## 推荐方案\n\n**我强烈推荐使用方案2（Textual TUI）**，因为它：\n\n1. **原生 Python**，易于修改和扩展\n2. **左右分屏设计**，左文件浏览，右实时聊天\n3. **支持鼠标操作**，点击文件即可选择\n4. **流式输出**，AI 回复实时显示\n5. **自动集成 Git 文件列表**\n\n安装依赖：\n```bash\npip install textual asyncio\n```\n\n运行：\n```bash\npython ai_split.py\n```\n\n**快捷键**：\n- `Tab`：切换焦点（文件/聊天）\n- `↑/↓`：浏览文件列表\n- `Enter`：选择文件\n- `Ctrl+S`：发送消息\n- `Ctrl+C`：退出\n\n这个方案既满足了分屏需求，又能直接操作 Git 文件和 AI 聊天！"
