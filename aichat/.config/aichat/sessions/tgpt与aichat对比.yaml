    │  main.rs  │  [历史记录滚动区]                              │
    │  lib.rs   │                                                  │
    ├──────────┴───────────────────────────────────────────────────┤
    │  ▶ 输入区域 (Tab 补全路径 + 预测建议)  [Ctrl+S发送]       │  ← 输入栏
    │  [附件: file.txt] [图片: screenshot.png]                    │  ← 附件栏
    └──────────────────────────────────────────────────────────────┘
         ← 30% →              ← 70% → (宽度自适应)
    ```

    ### 2. 核心功能需求

    #### A. 会话管理
    - **会话标题**：自定义或自动生成（基于首条消息）
    - **历史记录**：
      - 保存/加载历史会话（JSON/Markdown 格式）
      - 会话列表面板（可切换）
      - 搜索历史消息
    - **会话状态**：显示消息数量、token 使用量

    #### B. 角色系统 (Role)
    - **预设角色**：代码助手、翻译官、代码审查员、架构师等
    - **自定义角色**：用户可创建/编辑角色模板
    - **角色切换**：下拉选择或快捷键切换
    - **角色提示**：显示当前角色的系统提示词

    #### C. 模型切换
    - **模型列表**：从 aichat/tgpt 配置读取可用模型
    - **动态切换**：不中断会话情况下切换模型
    - **模型信息**：显示当前模型名称、上下文长度、价格

    #### D. 文件输入与路径补全
    - **Tab 补全**：
      - 当前工作目录路径补全
      - 支持相对路径和绝对路径
      - 递归搜索子目录
      - 模糊匹配（fzf 风格）
    - **文件预测**：
      - 根据输入前缀预测文件/目录
      - 最近使用文件优先
      - Git 跟踪文件优先显示
    - **多文件上传**：
      - 选择多个文件作为上下文
      - 显示已选择文件列表
      - 支持拖拽文件（取决于终端）

    #### E. 自适应布局
    - **窗口适配**：
      - 自动检测终端尺寸变化
      - 宽度 < 80 列：上下布局
      - 宽度 >= 80 列：左右布局
    - **面板比例**：
      - 默认 30:70
      - 可拖动调整（鼠标或快捷键）
      - 可配置固定宽度
    - **字体缩放**：
      - 根据窗口大小自动调整字体
      - 支持自定义字体大小
    - **边距和填充**：
      - 自动调整内边距
      - 避免内容溢出

    ### 3. 交互细节

    | 操作 | 快捷键 | 说明 |
    |------|--------|------|
    | 发送消息 | Ctrl+S / Enter | 发送当前输入 |
    | 切换焦点 | Tab | 文件树 ↔ 聊天 ↔ 输入 |
    | 切换模型 | Ctrl+M | 弹出模型选择菜单 |
    | 切换角色 | Ctrl+R | 弹出角色选择菜单 |
    | 历史搜索 | Ctrl+H | 搜索历史消息 |
    | 新会话 | Ctrl+N | 创建新会话 |
    | 文件补全 | Tab | 路径自动补全 |
    | 选择文件 | Enter | 将文件作为上下文 |
    | 删除附件 | Ctrl+D | 删除已选文件 |
    | 调整面板 | Ctrl+[ / ] | 调整左右比例 |
    | 复制消息 | Ctrl+C | 复制选中消息 |
    | 搜索 | Ctrl+F | 搜索当前会话 |

    ### 4. 技术架构

    ```
    ┌────────────────────────────────────────────┐
    │             TUI 前端 (Textual/Bubble Tea)  │
    │  ┌─────────┐  ┌──────────┐  ┌──────────┐  │
    │  │ 文件浏览 │  │ 聊天面板 │  │ 输入区域 │  │
    │  │ (Tree)   │  │ (TextLog)│  │ (Input)  │  │
    │  └────┬────┘  └────┬─────┘  └────┬─────┘  │
    │       │            │             │         │
    ├───────┴────────────┴─────────────┴─────────┤
    │             中间层 (Adapter)                │
    │  ┌──────────┐  ┌──────────┐  ┌──────────┐  │
    │  │ 会话管理  │  │ 文件系统  │  │ 配置管理  │  │
    │  └────┬─────┘  └────┬─────┘  └────┬─────┘  │
    │       │            │             │         │
    ├───────┴────────────┴─────────────┴─────────┤
    │            AI 引擎层 (aichat/tgpt)          │
    │  ┌──────────┐  ┌──────────┐  ┌──────────┐  │
    │  │ API 调用  │  │ 流式处理  │  │ 模型管理  │  │
    │  └──────────┘  └──────────┘  └──────────┘  │
    └────────────────────────────────────────────┘
    ```

    ### 5. 配置文件 (`~/.config/ai-chat/config.yaml`)

    ```yaml
    # AI 配置
    ai:
      backend: aichat  # 或 tgpt
      default_model: deepseek-chat
      models:
        - name: deepseek-chat
          provider: deepseek
        - name: gpt-4
          provider: openai

    # 界面配置
    ui:
      layout: horizontal  # horizontal | vertical | auto
      ratio: 30:70  # 左:右
      min_width_for_horizontal: 80
      theme: catppuccin  # 主题
      font_size: auto  # 或 12, 14 等

    # 会话配置
    session:
      autosave: true
      save_path: ~/.local/share/ai-chat/sessions
      max_history: 1000  # 最大历史消息数

    # 文件配置
    files:
      git_only: true  # 只显示 Git 跟踪文件
      max_depth: 5    # 最大目录深度
      tab_complete: true
      predict: true

    # 角色配置
    roles:
      default: code-assistant
      custom:
        - name: code-reviewer
          prompt: "你是一位经验丰富的代码审查员..."
    ```

    ### 6. 实现优先级

    1. **P0（必须）**：
       - 左右分屏 + 自适应布局
       - 基本聊天功能（流式输出）
       - 模型切换
       - Tab 路径补全

    2. **P1（重要）**：
       - 文件浏览器 + 选择文件作为上下文
       - 会话标题和历史记录
       - 角色系统
       - 窗口 resize 自适应

    3. **P2（增强）**：
       - 多会话管理
       - 附件显示
       - 文件预测（fzf 风格）
       - 拖拽支持

    4. **P3（未来）**：
       - 多语言 i18n
       - 插件系统
       - 分屏聊天（同时多个 AI 对话）
       - 代码语法高亮
