    ## aichat 的典型特性

    ### 核心功能
    - **多提供商支持**：OpenAI、Gemini、Claude、Groq、Ollama、本地模型等
    - **角色/Agent 系统**：支持自定义角色预设（Role/Agent）
    - **会话管理**：支持保存、加载、列出对话历史
    - **RAG（检索增强生成）**：支持将文件内容作为上下文
    - **Shell 集成**：生成并执行 Shell 命令
    - **代码生成**：专门的代码生成模式

    ### 与 tgpt 的主要区别

    | 特性 | tgpt | aichat |
    |------|------|--------|
    | **默认提供商** | pollinations（免费） | 通常需要自己配置 |
    | **角色/Agent** | 无专门的角色系统 | 有完善的角色预设机制 |
    | **会话管理** | 简单 | 更完善的会话管理 |
    | **RAG/文件上下文** | 通过管道输入 | 原生支持文件作为上下文 |
    | **配置方式** | 环境变量 + CLI 参数 | 配置文件 + 环境变量 |
    | **交互体验** | 简洁轻量 | 功能更丰富 |

    ### 典型用法

    ```bash
    # 基本对话
    aichat "什么是云计算？"

    # 使用角色
    aichat --role linux-expert "如何排查网络问题？"

    # Shell 命令模式
    aichat -s "查找所有大于1GB的文件"

    # 文件作为上下文
    aichat -f error.log "分析这个日志文件中的错误"

    # 交互模式
    aichat -i

    # 使用特定模型
    aichat -m gpt-4 "..."
    ```

    ---

