             │\n│  [b] AI: 我看这是一个 Rust 项目...                      │\n│                                                         │\n│  [c] main.rs     [d] lib.rs     [e] config.rs           │ ← 文件也标注字母\n│  [f] Cargo.toml  [g] README.md  [h] tests/              │\n│                                                         │\n│  操作: [i]编辑 [j]复制 [k]删除 [l]引用                  │\n│        [m]搜索 [n]翻译   [o]解释  [p]优化               │\n│                                                         │\n│  [q]模型切换 [r]角色切换 [s]保存会话 [t]导出           │\n└──────────────────────────────────────────────────────────┘\n\n\" 按 a: 跳到用户消息\n\" 按 b: 跳到 AI 回复\n\" 按 c: 打开 main.rs\n\" 按 i: 编辑当前内容\n\" 按 q: 切换模型（显示模型列表）\n```\n\n### 2. 层级 Hint：按 `f` 后再按 `f`\n\n```\n# 第一层：按 f\n> f\n\n[a] 消息1  [b] 消息2  [c] 文件1  [d] 文件2\n[e] 模型   [f] 角色   [g] 会话   [h] 设置\n\n# 按 e 后，进入模型选择子层（自动显示字母）\n[e] ─── 模型选择（按字母切换）\n  [a] deepseek-chat\n  [b] gpt-4\n  [c] claude-3\n  [d] llama-3\n  [e] mistral\n\n# 按 a 切换到 deepseek-chat\n```\n\n### 3. 序列操作：连续 Hint\n\n```\n# 复制一段代码并发送给另一个模型\n\n> f          \" 进入 Hint 模式\n\" 代码块显示为 [a]\n> a          \" 选中代码块\n\" 出现操作选项: [c]复制 [r]引用 [e]编辑 [s]发送到...\n> c          \" 复制\n> f          \" 再次 Hint\n> e          \" 选择模型切换\n> a          \" 选择 deepseek\n> f          \" Hint\n> s          \" 选择发送\n```\n\n### 4. 文件浏览器中的 Hint\n\n```\n:open src/\n\n┌────────────────────────────────────┐\n│ src/                              │\n│                                   │\n│ [a] main.rs      [b] lib.rs      │\n│ [c] utils/       [d] modules/    │\n│ [e] config.rs    [f] types.rs     │\n│                                   │\n│ 操作:                              │\n│ [g] 打开         [h] 预览         │\n│ [i] 引用到对话   [j] 比较         │\n│ [k] 递归打开     [l] 搜索内容     │\n└────────────────────────────────────┘\n\n\" 按 a: 打开 main.rs\n\" 按 c: 进入 utils/ 目录（显示新的 Hint）\n\" 按 g: 打开选中文件\n\n\" 在 utils/ 目录\n┌────────────────────────────────────┐\n│ utils/                            │\n│                                   │\n│ [a] helper.