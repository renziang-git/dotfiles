    │  └────────────┘  └──────────────┘  └─────────┘  │
    │                        │                           │
    │        调用子进程（aichat / tgpt）                 │
    │                stdin/stdout                        │
    └──────────────────────────────────────────────────┘
    ```

    ### 具体实现路线

    #### 1. 选择 TUI 框架
    - **Python**: [Textual](https://textual.textualize.io/)（活跃、有异步支持、直接支持 Rich 语法）
    - **Go**: [Bubble Tea](https://github.com/charmbracelet/bubbletea)（轻量、高性能）
    - **Rust**: [Ratatui](https://github.com/ratatui-org/ratatui)（灵活但开发慢）

    > 推荐 **Textual**，因为 Python 易于调用子进程、处理 JSON、快速迭代，且自带原生滚动、Input、Tree 等组件。

    #### 2. 后端封装（包装 `aichat`）

    ```python
    import asyncio
    from textual.app import App, ComposeResult
    from textual.widgets import Input, RichLog, Header, Footer
    from textual.containers import Horizontal, Vertical
    from textual.screen import Screen
    import subprocess

    class AIChat:
        """调用 aichat 子进程，流式获取结果"""
        def __init__(self, model="gpt-4o"):
            self.model = model

        async def stream_query(self, message, file_paths=None):
            cmd = ["aichat", "-m", self.model]
            if file_paths:
                # aichat 支持 -f 传入文件
                for f in file_paths:
                    cmd.extend(["-f", f])
            cmd.append(message)

            proc = await asyncio.create_subprocess_exec(
                *cmd,
                stdout=asyncio.subprocess.PIPE,
                stderr=asyncio.subprocess.PIPE,
            )
            # 逐行读取实现流式效果
            while True:
                line = await proc.stdout.readline()
                if not line:
                    break
                yield line.decode().rstrip()
    ```

    然后在 UI 的事件循环中，将 `stream_query` 的产出逐步 append 到 `RichLog` 组件。

    #### 3. 现代化交互设计

    | 需求 | 实现方式 |
    |------|----------|
    | **参数选择** | 右侧或底部面板：下拉列表选择模型（通过 `aichat --list-models` 动态获取）、滑动条控制温度 |
    | **快速切换 AI** | 快捷键（如 Ctrl+P）弹出模糊搜索窗口（类似 fzf），选择模型/Provider |
    | **文件/图片上传** | Textual 的 `FileBrowser` 组件，选择后自动调用 `-f` 传给 aichat，图片会被自动识图 |
    | **下载** | AI 返回的链接或代码块，提供快捷键复制或打开；也可结合 `aichat --output` 保存 |
    | **实时对话** | 子进程使用 `asyncio.subprocess` 管道，每收到一行就刷新 UI 中的消息气泡 |
    | **会话管理** | 调用 `aichat -s <session_name>` 实现历史保持，同时 UI 侧记录当前会话名 |

    #### 4. 为什么不直接用 `tgpt`？

    - `aichat` 的 **RAG** 和 **会话系统** 更成熟，文件 PDF/图片/URL 自动解析，符合“文件上传与下载”的需求。
    - `tgpt` 更轻量，但需要自己处理历史（无内置会话）。如果你主要做快速问答，`tgpt` 也完全可用。

    **建议优先用 `aichat`**，它的 `-f` 能直接读文件内容（包括图片转 base64），无需额外处理。

    ---

    ## 快速原型（Textual + aichat）

    以下是一个极简示例，展示核心结构：

    ```python
    # simple_chat.py
    from textual.app import App, ComposeResult
    from textual.widgets import Header, Footer, Input, RichLog
    from textual.containers import Horizontal, Vertical
    from textual.binding import Binding
    import asyncio

    class ChatApp(App):
        BINDINGS = [
            Binding("ctrl+c", "quit", "退出"),
            Binding("ctrl+n", "new_session", "新建会话"),
        ]

        def compose(self) -> ComposeResult:
            yield Header()
            yield RichLog(id="chat", highlight=True, markup=True)
            yield Input(id="input", placeholder="输入消息...")
            yield Footer()

        async def on_input_submitted(self, event: Input.Submitted):
            input = self.query_one("#input")
            chat = self.query_one("#chat")
            msg = event.value
            input.value = ""

            # 调用 aichat 子进程
            cmd = ["aichat", "-m", "gpt-4o-mini", msg]
            proc = await asyncio.create_subprocess_exec(
                *cmd,
                stdout=asyncio.subprocess.PIPE,
                stderr=asyncio.subprocess.PIPE,
            )

            chat.write(f"[bold blue]你:[/] {msg}")
            async for line in proc.stdout:
                text = line.decode().rstrip()
                if text:
                    chat.write(f"[bold green]AI:[/] {text}")

    if __name__ == "__main__":
        ChatApp().run()
    ```

    运行 `pip install textual` 和 `aichat`，即可体验雏形。

    ---

    ## 对比：从头写 vs 包装

    | 维度 | 从头写 | 包装 aichat/tgpt |
    |------|--------|------------------|
    | **开发时间** | 2~4 周（含调试多模型 API） | 3~5 天（UI 调优） |
    | **模型兼容性** | 需手动解析 20+ API | 天然支持全部模型 |
    | **图片理解** | 手动转 base64，复杂 | `-f` 自动处理 |
    | **会话/角色** | 自己实现数据库 | `-s` `-r` 直接使用 |
    | **维护压力** | 高 | 低（依赖工具升级） |

    **结论：包装路线胜出。** 你能用更短时间做出更强大、更稳定的产品。

    ---

    ## 最终建议

    1. **立即开始**：用 Textual + aichat 搭建最小原型（如上面代码），体会流式交互。
    2. **扩展功能**：添加文件选择器（Textual 内置 `FileBrowser`），配置面板（`Screen` 弹出窗口），快捷键切换模型。
    3. **可选美化**：如需要真正“现代化终端窗口”，可参考 [Textual 的 CSS 示例](https://textual.textualize.io/guide/CSS/)，自定义圆角、颜色、布局。

    这样一来，你用 **极小的开发成本**，就能获得一个 **功能媲美桌面应用** 的终端 AI 对话工具。

