    ```markdown
    # AI Chat Terminal 完整需求规范

    ## 项目概述
    构建一个终端 AI 聊天程序，交互风格融合 **Vim 模式**和 **qutebrowser 的 Hint 模式**，完全键盘驱动，无鼠标。核心特色：
    - **Hint 模式**：按 `f` 键在所有交互元素上显示字母标签，按字母直接触发操作。
    - **Tab 命令预测**：按 `Tab` 弹出智能动作预测框，显示带快捷键的上下文选项。
    - **全键盘操作**：所有功能（包括文件浏览、模型切换、命令执行）均可通过键盘完成。

    ## 技术栈
    - **语言**：Go
    - **TUI 框架**：Bubble Tea
    - **AI 后端**：包装 CLI 工具 `tgpt` 或 `aichat`（流式输出）
    - **终端兼容**：xterm, kitty, alacritty（256色/TrueColor）

    ## 布局系统
    - **默认左右分栏**：左侧 30% 文件浏览器（NERDTree 风格），右侧 70% 聊天区域。
    - **自适应**：终端宽度 < 80 列时自动切换为上下堆叠（聊天在上，文件在下）。
    - **窗口焦点**：使用 `Ctrl+w h/j/k/l` 在分栏间移动焦点，`Ctrl+w s/v` 创建新分栏。
    - **状态栏**：底部显示当前模型、会话名、模式（NORMAL/INSERT/HINT）。

    ## 核心功能

    ### 1. Hint 模式（最高优先级）
    - **触发**：按 `f` 键进入 Hint 模式，所有可交互元素（消息、按钮、文件、模型列表、角色、设置项）上显示字母标签（如 `[a]`、`[b]`）。
    - **操作**：按下对应字母，立即执行该元素绑定的动作。
    - **多级 Hint**：如果元素有子菜单（如消息可复制、引用、重新生成），按 `f` 后显示主菜单，再按对应字母，子菜单出现新的字母标签。
    - **多选**：`Shift+F` 进入多选模式，可连续选择多个元素后统一操作（如同时引用多条消息）。
    - **动态更新**：当界面变化（如收到新回复、切换会话）后，Hint 标签重新生成。
    - **所有元素必须可 Hint**：包括发送按钮、模型切换、角色切换、历史消息、文件树节点、配置选项等。

    ### 2. Tab 命令预测
    - **触发**：在任何模式下按 `Tab` 键，弹出智能预测框。
    - **预测内容**：基于当前上下文动态推荐——例如输入 `/` 时推荐路径，输入 `:` 时推荐命令，对话中推荐 AI 动作（分析、优化、翻译）。
    - **快捷键**：每个预测项显示字母标签 `[a]` `[b]` `[c]`；支持二级菜单（如 `a1`、`a2`）。
    - **排序逻辑**：常用操作优先，历史使用频次加权，AI 根据当前对话推荐置顶。
    - **历史学习**：记录用户选择的预测项，自动提升未来优先级。
    - **子菜单**：预测项可嵌套，进入子菜单后显示新的字母标签。

    ### 3. 命令模式
    - **进入**：按 `:` 进入命令模式，类似 Vim 的命令行。
    - **命令列表**：
      - `:open <file>` / `:o` – 打开文件（支持 Tab 补全）
      - `:send <text>` – 发送消息
      - `:model <name>` – 切换 AI 模型（支持 Tab 列出可用模型）
      - `:role <role>` – 切换角色（助手、代码审查员、翻译等）
      - `:session <action>` – 会话操作（list、save、load、delete）
      - `:file <path>` – 引用文件（支持模糊路径补全）
      - `:clear` – 清除当前会话
      - `:save <path>` – 保存对话记录
      - `:search <keyword>` – 搜索历史消息
      - `:help` / `?` – 显示帮助
      - `:q` – 退出程序
    - **补全**：所有命令参数支持 Tab 补全（路径、模型名、角色名、会话名）。
    - **历史**：上下方向键浏览命令历史；`Ctrl+r` 反向搜索历史。

    ### 4. Vim 操作风格
    - **模式系统**：NORMAL（默认）、INSERT（输入消息）、VISUAL（选择文本）、COMMAND（`:` 后）。
    - **导航**：
      - `j/k`：上下滚动（聊天区域或文件树）
      - `h/l`：左右切换分栏焦点
      - `gg/G`：跳转到列表顶部/底部
      - `Ctrl+d/u`：半页滚动
    - **搜索**：
      - `/`：向前搜索（消息内容）
      - `?`：向后搜索
      - `n/N`：下一个/上一个匹配
    - **标签页**：
      - `gt` / `gT`：下一个/上一个标签页
      - `Ctrl+t`：新建空白标签页
      - `Ctrl+w q`：关闭当前标签页
    - **退出**：`ZZ` 保存会话并退出，`ZQ` 直接退出，`:q!` 强制退出。

    ### 5. 会话管理
    - **多标签页**：每个标签页独立会话，可切换会话上下文。
    - **自动保存**：每隔 N 秒或退出时自动保存会话到 `~/.config/ai-chat/sessions/`。
    - **操作**：通过命令或 Hint 菜单进行会话创建、重命名、删除、导入/导出。
    - **历史**：保留最近 100 条会话记录，支持模糊搜索。

    ### 6. 文件系统集成
    - **文件浏览器**：左栏显示目录树，可展开/折叠（`+`/`-` 或 `Enter`）。
    - **文件预览**：选中文件时在聊天区域右侧临时显示预览。
    - **Git 状态**：文件旁显示 Git 修改状态（`M` 修改、`A` 新增、`?` 未跟踪），需执行 `git status` 解析。
    - **引用文件**：在输入框中按 `Ctrl+x` 或命令 `:file` 插入文件路径，也可通过 Hint 模式选择文件后自动引用。
    - **右键菜单**：通过 Hint 模式在文件上显示操作（打开、引用、预览、删除）。

    ### 7. AI 后端集成
    - **调用方式**：包装 `tgpt` 或 `aichat` CLI，支持流式输出到聊天区域。
    - **模型切换**：实时切换（无需重启），支持 deepseek-chat、gpt-4、claude 等（通过配置提供）。
    - **角色系统**：内置角色（助手、代码分析师、翻译、创意写手），可自定义。
    - **文件上下文**：引用文件内容作为 AI 上下文自动嵌入。
    - **错误处理**：API 超时、网络断开、无效模型时友好提示并允许重试。

    ## UI 组件设计细节

    ### 预测框
    ```go
    type PredictionBox struct {
        Title    string              // 框标题（如“命令”、“动作”）
        Items    []PredictionItem    // 主选项
        SubItems []PredictionItem    // 选中某选项后的二级选项（可选）
        Position Position            // 显示位置（左上、右上、跟随输入光标）
    }
    type PredictionItem struct {
        Key      string             // 快捷键字母（a, b, c 或 a1, a2）
        Label    string             // 显示文本
        Action   func()             // 执行的动作
        Children []PredictionItem   // 子菜单（动态生成新预测框）
        Hotkey   string             // 预设快捷键（如 Ctrl+r）
    }
    ```

    ### Hint 标签系统
    ```go
    type HintSystem struct {
        Active       bool
        Elements     []HintElement   // 当前界面所有可提示元素
        Keymap       map[string]*HintElement  // 字母 → 元素指针
        History      []string       // 已选过的字母（用于多选）
        MultiSelect  bool           // 是否处于多选模式
    }
    type HintElement struct {
        ID        int
        Label     string           // 显示的字母
        Bounds    rectangle.Rectangle // 屏幕坐标位置
        Action    func()           // 触发动作
        Parent    *HintElement     // 父元素（子菜单用）
        Children  []*HintElement   // 子元素
        Metadata  map[string]interface{} // 额外数据（如文件路径、模型名）
    }
    ```

    ### 配置（YAML）
    ```yaml
    # ~/.config/ai-chat/config.yaml
    theme:
      primary: blue
      hint_bg: yellow
      hint_fg: black
      command_fg: green
      status_bg: purple

    hint:
      key: "f"
      multi_select_key: "F"
      timeout: 0             # 0 表示无超时，始终显示

    tab_prediction:
      max_items: 10
      show_hotkeys: true
      learning: true

    sessions:
      auto_save_interval: 30  # 秒
      history_limit: 100
      default_path: ~/.config/ai-chat/sessions

    ai:
      backend: tgpt            # 或 aichat
      default_model: deepseek-chat
      api_key_env: TGPT_API_KEY

    file_browser:
      show_git_status: true
      git_command: git status --porcelain
      exclude: [".git", "node_modules", ".DS_Store"]
    ```

    ## 示例交互流程

    1. 程序启动，显示左栏文件浏览器，右栏空白聊天区，底部状态栏显示 `NORMAL | model:deepseek-chat | session:default`。
    2. 按 `f` 进入 Hint 模式，文件树每个节点显示 `[a] [b] [c]...`，聊天区空白处显示 `[d] 新建会话 [e] 打开设置`。
    3. 按 `a` 选中根目录，文件树展开；按 `f` 再次更新 Hint。
    4. 按 `Tab` 弹出预测框，显示 `[a] 发送消息 [b] 切换模型 [c] 打开文件`；按 `a` 或直接输入 `:` 进入命令模式。
    5. 输入 `:model deepseek-chat Enter`，状态栏模型更新。
    6. 输入消息并回车，AI 流式回复。
    7. 回复结束后，按 `f` 显示回复元素的 Hint：`[a] 复制 [b] 引用到输入 [c] 继续对话 [d] 重新生成`。

    ## 开发分阶段建议

    ### Phase 1 – 基础框架（预期结果：可启动的空壳）
    - 完成 Bubble Tea 应用结构
    - 左右分栏布局（静态，无功能）
    - 简单的 NORMAL 模式，支持 `j/k` 滚动
    - 一个输入框，可打字，无 AI 集成

    ### Phase 2 – Hint 模式核心
    - 实现 `f` 键触发 Hint 显示的基本逻辑
    - 为几个固定元素（如“发送”、“新建”）显示字母标签
    - 支持单字母点击执行

    ### Phase 3 – 命令模式 + Tab 预测
    - `:` 进入命令，执行 `:model` `:session` 等基本命令
    - 按 `Tab` 显示静态预测框，含字母快捷键

    ### Phase 4 – 会话与文件浏览器
    - 多标签页、会话保存/加载
    - 文件树显示，支持展开/折叠
    - 文件引用到输入框

    ### Phase 5 – AI 后端集成
    - 包装 tgpt 实现流式输出
    - 模型切换、角色切换
    - 错误处理与重试

    ### Phase 6 – 完整功能与优化
    - 多级 Hint、多选
    - 预测框自学习
    - Git 状态显示
    - 配置文件解析
    - 性能优化（分页、内存管理）

    ## 技术约束
    - 所有交互必须通过键盘，无鼠标依赖
    - 流式渲染 AI 回复，不阻塞 UI
    - 错误时显示错误信息，不崩溃
    - 配置更改后实时生效（或重启后生效）

