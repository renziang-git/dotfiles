    **aichat** is a more feature-rich CLI AI tool with advanced capabilities including: role/agent systems (`-r`, `-a`), session management (`-s`), RAG (retrieval-augmented generation, `--rag`), macro commands (`--macro`), direct file/URL inclusion (`-f`), server mode (`--serve`), and comprehensive resource listing (`--list-models`, `--list-roles`, etc.).

    Key distinction: tgpt is ideal for quick, zero-configuration use with free default AI access, while aichat excels in complex, project-level workflows requiring session persistence, role-based interactions, and document context.

