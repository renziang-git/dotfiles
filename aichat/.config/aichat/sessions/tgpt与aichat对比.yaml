", \"运行\", \"保存\", \"对比\"]\n    \n    - when: \"输入包含错误信息\"\n      suggest: [\"搜索解决方案\", \"解释错误\", \"修复建议\"]\n    \n    - when: \"文件被修改\"\n      suggest: [\"保存更改\", \"对比版本\", \"回退修改\"]\n```\n\n### 9. 实时使用示例\n\n```bash\n# 场景：分析代码并优化\n\n# 1. 打开文件\n:open src/main.rs\n\n# 2. 看到代码后，输入命令\n> 分析这段代码 [Tab]\n\n# Tab 弹出预测框\n┌─────────────────────────┐\n│ [a] 发送给 AI 分析      │\n│ [b] 静态分析工具        │\n│ [c] 代码审查            │\n│ [d] 安全审计            │\n└─────────────────────────┘\n\n# 3. 按 a\n# AI 开始分析，完成后\n# 自动弹出新的预测\n\n┌─────────────────────────┐\n│ 🔧 分析完成             │\n│                         │\n│ [a] 应用优化建议        │\n│ [b] 查看详情            │\n│ [c] 导出报告            │\n│ [d] 对比优化前后        │\n└─────────────────────────┘\n\n# 4. 按 a 应用优化\n# 代码自动修改，显示差异\n\n# 5. 再次 Tab 查看更多操作\n┌─────────────────────────┐\n│ 📋 后续操作             │\n│                         │\n│ [a] 运行测试验证        │\n│ [b] 提交代码            │\n│ [c] 创建 Pull Request   │\n│ [d] 添加注释文档        │\n└─────────────────────────┘\n```\n\n### 10. 设计原则\n\n1. **即时性**：Tab 一键弹出，无需思考\n2. **上下文感知**：根据当前状态推荐最相关的操作\n3. **无鼠标操作**：全键盘控制，字母快捷键 + 方向键\n4. **智能排序**：常用操作排前面，AI 推荐排最前\n5. **渐进式发现**：从简单到复杂，逐步展示更多选项\n6. **可配置性**：用户可以自定义预测规则和快捷键\n\n**最终体验**：按 Tab → 看到所有可能的操作 → 按字母选择 → 完成。每个操作不超过 3 次按键，形成肌肉记忆后操作速度极快。"
