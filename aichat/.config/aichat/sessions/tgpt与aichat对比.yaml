    ```

    ### 方案 3：自定义请求处理（最彻底）
    ```lua
    ["deepseek-flash"] = {
        __inherited_from = "openai",
        endpoint = "https://api.deepseek.com/v1",
        model = "deepseek-v4-flash",
        api_key_name = "DEEPSEEK_API_KEY",
        max_tokens = 4096,
        extra_request_body = {
            temperature = 0.7,
        },
        -- ✅ 自定义请求处理，删除 reasoning_content
        custom_endpoint = function(messages, options)
            for _, msg in ipairs(messages) do
                msg.reasoning_content = nil
            end
            return {
                url = "https://api.deepseek.com/v1/chat/completions",
                body = {
                    model = "deepseek-v4-flash",
                    messages = messages,
                    max_tokens = 4096,
                    temperature = 0.7,
                },
            }
        end,
    },
    ```

    ## 立即验证
    修改配置后，重启 Neovim 并测试：
    ```vim
    :AvanteChat
    ```
    应该不会再报 `reasoning_content` 错误了。

    如果还是报错，**说明 avante 的 openai 适配器在底层处理时有问题**，建议暂时改用 `aichat` CLI 工具写代码：
    ```bash
    # 在终端用 aichat 代替 avante
    aichat -p code --model deepseek-v4-flash "你的问题"
    ```

    ## 总结
    - ✅ **根本原因**：DeepSeek v4 模型返回 `reasoning_content`，avante 不支持
    - ✅ **解决方案**：在 `extra_request_body` 中添加 `thinking = false`
    - ✅ **备选**：用 `aichat` 替代 avante 进行代码生成
