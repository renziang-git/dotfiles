   // 执行动作\n    Children []PredictionItem  // 子选项\n    Hotkey   string    // 快捷键\n}\n```\n\n### Hint 标签系统\n```go\ntype HintSystem struct {\n    Active     bool\n    Elements   []HintElement\n    Keymap     map[string]HintElement  // 字母 → 元素\n    History    []string                // 历史选择\n    MultiSelect bool                  // 是否多选\n}\n\ntype HintElement struct {\n    ID       string\n    Label    string    // 显示的字母\n    Bounds   Rectangle\n    Action   func()\n    Parent   *HintElement  // 父元素（用于子菜单）\n    Children []HintElement // 子元素\n}\n```\n\n## 配置文件\n```yaml\n# ~/.config/ai-chat/config.yaml\ntheme:\n  primary: blue\n  hint_bg: yellow\n  hint_fg: black\n  \nhint:\n  key: \"f\"\n  multi_select: \"F\"\n  \ntab_prediction:\n  max_items: 10\n  auto_select: true\n  learning: true\n  \nsessions:\n  auto_save: true\n  max_history: 100\n```\n\n## 技术要求\n1. 低延迟：AI 响应需流式显示（streaming）\n2. 内存友好：大量对话时自动分页\n3. 跨平台：Linux/macOS/Windows (WSL)\n4. 错误处理：API 超时、网络断开等优雅处理\n5. 无障碍：支持 256 色终端和 True Color\n\n## 注意事项\n1. Hint 模式优先于所有其他操作\n2. 所有交互元素都必须 hintable\n3. Tab 预测必须考虑当前上下文\n4. 保持与 Vim 用户习惯一致\n5. 提供可配置性但默认设置要合理\n\n请根据以上需求生成完整的 Go 程序代码，使用 Bubble Tea 框架。\n```\n\n## 🚀 在 Neovim 中使用 avante 的步骤\n\n### 1. 准备 prompt 文件\n```bash\n# 将上面的内容保存为文件\n$ nvim ai-chat-prompt.md\n```\n\n### 2. 在 Neovim 中打开 avante\n```vim\n\" 打开侧边栏\n:AvanteOpen\n\n\" 或者直接打开对话\n:AvanteChat\n```\n\n### 3. 输入指令\n```\n请根据以下需求文档，生成一个完整的 Go 语言命令行 AI 聊天程序。\n使用 Bubble Tea 框架，实现所有指定的功能。\n\n[粘贴或引用 prompt.md 的内容]\n```\n\n### 4. 分阶段生成建议\n\n**第一阶段**（先让 AI 生成核心框架）：\n```\n请先实现第一阶段：\n1. 基础 Bubble Tea 应用框架\n2. 简单的左右分栏布局\n3. 基础的 Hint 模式（f 键显示固定标签）\n4. 输入框和消息显示\n\n不需要：\n- 完整的会话管理\n- AI 后端集成（用 mock 数据）\n- 文件浏览器\n- 复杂的配置系统\n```\n\n**第二阶段**（逐步增加功能）：\n```\n第一阶段代码已实现，现在添加：\n1. Tab 命令预测功能\n2. 命令模式（: 开头）\n3. 会话保存/加载\n```\n\n**第三阶段**：\n```\n添加：\n1. 文件浏览器\n2. AI 后端集成（tgpt）\n3. 动态 Hint 模式\n```\n\n### 5. 调试优化技巧\n\n```bash\n# 每次生成后，立即测试\n$ cd ~/projects/ai-chat\n$ go run main.go\n\n# 记录问题，反馈给 avante\n\"Issue: Tab prediction box doesn't show keyboard shortcuts.\nPlease fix to show [a] [b] [c] labels for each option.\"\n```\n\n### 6. 迭代改进的关键点\n\n1. **每次只给一个明确的功能增加**\n2. **提供具体的代码上下文**（当前文件内容）\n3. **描述问题时要精确**（不要模糊描述）\n4. **善用 avante 的 diff/undo 功能**看改动\n5. **手动测试每个交互**（Hint 模式、Tab 预测）\n\n**最佳实践**：不要一次性让 AI 生成全部代码，而是分模块逐步添加，这样更可控，也更容易调试。"
