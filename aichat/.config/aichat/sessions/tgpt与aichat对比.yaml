    A recommended workflow was discussed: use DeepSeek Flash for initial code generation, then switch to DeepSeek Pro for improvements. This **improves cache hit rates** because Flash generates the base content that Pro reuses as input context, creating overlapping tokens that the cache can serve. However, sessions should be reset every 3-5 iterations to avoid error accumulation.

    This is a summary of the chat history as a recap: Here's a brief summary of our discussion:

    ## Summary

    We designed a **Vim/qutebrowser-style terminal AI chat program** in Go using Bubble Tea, with two core interaction modes: **Hint mode** (press `f` to show letter labels on all elements) and **Tab command prediction** (predictive action box). Features include split-pane layout, command mode (`:` with Tab completion), session management, file system integration with Git status, and multi-tab conversations.

    **Development approach**: Use avante.nvim with DeepSeek models to generate code **incrementally** by phases (base framework → Hint mode → command mode → sessions → AI backend → polish).

    **Key issue encountered**: avante.nvim error `"The reasoning_content in the thinking mode must be passed back to the API."` This happens because **DeepSeek v4 models** (`deepseek-v4-flash`, `deepseek-v4-pro`) return `reasoning_content` fields that avante doesn't handle. **Solution**: Add `thinking = false` and `reasoning = false` to `extra_request_body` in avante's provider config, or switch to `deepseek-chat` model which lacks thinking mode. If avante persists, use `aichat` CLI tool as fallback.
