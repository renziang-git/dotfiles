    这个问题问得好！让我来解释这个有趣的现象：

    ## 为什么 `aichat` 选项更少但功能更强？

    这是**设计哲学**的不同，而不是功能数量的差异：

    ### 1. **参数复用 vs 独立参数**

    **aichat** 的设计更巧妙：
    ```bash
    # aichat 用少数字段覆盖更多场景
    --list-models    # 一个选项列出所有模型
    --list-roles     # 一个选项列出所有角色
    --list-sessions  # 一个选项列出所有会话
    --list-agents    # 一个选项列出所有Agent
    --list-rags      # 一个选项列出所有RAG
    --list-macros    # 一个选项列出所有宏

    # tgpt 每个功能都需要独立参数
    --list-providers  # 但只有这个
    # 其他功能没有对应的 list 命令
    ```

    ### 2. **模块化架构**

    `aichat` 的核心功能是通过**子系统**实现的，而不是通过参数：

    | 功能 | aichat | tgpt |
    |------|--------|------|
    | 角色系统 | `-r` + 角色名，配置文件管理 | `--preprompt`，需手动写提示词 |
    | 会话系统 | `-s` + 会话名，自动保存 | 无会话概念 |
    | 代理系统 | `-a` + 代理名，复杂任务链 | 无 |
    | RAG系统 | `--rag` + RAG名，文档索引 | 无 |
    | 宏系统 | `--macro` + 宏名，命令组合 | 无 |

    ### 3. **配置驱动 vs 参数驱动**

    **aichat** 的配置文件比 help 暗示的强大得多：
    ```yaml
    # ~/.config/aichat/config.yaml
    model: gpt-4
    temperature: 0.7
    roles:
      linux-admin:
        prompt: "你是Linux系统管理员..."
      code-reviewer:
        prompt: "你是代码审查专家..."

    agents:
      code-assistant:
        model: gpt-4
        roles: [linux-admin, code-reviewer]
        rag: project-docs
    ```

    实际上 `aichat` 的 **配置文件** 就是隐藏的"参数扩展"，而 `tgpt` 把所有选项都暴露在 help 中。

    ### 4. **功能深度不同**

    | 维度 | aichat | tgpt |
    |------|--------|------|
    | 模型支持 | 20+ 种（含本地） | 12 种（含本地） |
    | 函数调用 | ✅ 支持 | ❌ 不支持 |
    | 流式响应 | 可控（-S 开关） | 全局设置 |
    | 上下文管理 | 精确控制 | 有限 |

    ### 5. **简化设计带来的隐藏功能**

    `aichat` 用更少的参数，通过**组合**实现复杂功能：
    ```bash
    # 简单的参数组合实现复杂任务
    aichat -r linux-admin --rag my-docs -s troubleshoot -f /var/log/syslog

    # 等价于 tgpt 可能需要多个命令
    # tgpt 无类似组合能力
    ```

    ### 结论

    **少即是多** —— `aichat` 的简洁 help 是因为：
    1. 功能被抽象到**子系统**中（角色、RAG、Agent）
    2. 通过**配置文件**扩展功能
    3. 采用**模块化**设计，参数之间可组合
    4. 隐藏复杂度在**配置管理**中

    而 `tgpt` 把所有功能都暴露为命令行参数，所以 help 更长，但实际能做的事情更有限。

    **打个比方：**
    - `aichat` 像瑞士军刀 —— 外观简单，但每个工具都能组合使用
    - `tgpt` 像工具箱 —— 每个工具都看得见，但无法组合创新

    这就是软件设计中常说的 **"接口简单，实现强大"** 原则。
