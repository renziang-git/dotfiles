letter\"        # letter/number/emoji\nc.hints.uppercase = False      # 是否大写\nc.hints.position = \"left\"      # left/right/top/bottom\nc.hints.chars = \"abcdefghijklmnopqrstuvwxyz\"  # 自定义字符集\n\n# 颜色主题\nc.hints.normal = \"#00ff00\"     # 普通 Hint 颜色\nc.hints.active = \"#ffff00\"     # 选中 Hint 颜色\nc.hints.bg = \"#000000\"         # 背景色\nc.hints.border = true          # 是否显示边框\n```\n\n### 9. 高级：动态 Hint\n\n```\n# 上下文相关的 Hint\n> f\n\n# 如果是代码块代码\n[a] 运行 [b] 调试 [c] 测试 [d] 格式化\n\n# 如果是错误信息\n[a] 搜索解决方案 [b] 解释错误 [c] 修复建议\n\n# 如果是文件列表\n[a] 查看 [b] 编辑 [c] 对比 [d] 重命名\n```\n\n### 10. 完整使用示例\n\n```bash\n# 1. 启动\n$ ai-chat\n\n# 2. 按 f 看到所有操作\n> f\n[a] 输入消息  [b] 文件浏览器  [c] 模型切换\n[d] 角色切换  [e] 设置       [f] 帮助\n\n# 3. 按 b 打开文件浏览器\n> b\n[a] main.rs  [b] lib.rs  [c] utils/\n[d] 返回     [e] 添加到对话\n\n# 4. 按 a 选择 main.rs，再按 a 添加\n> a + a\n\n# 5. 按 f 回到主操作层\n> f\n\n# 6. 按 a 进入输入模式，输入问题\n> a + \"分析这个代码\"\n\n# 7. 看 AI 回复，按 f 对回复操作\n> f\n[a] 复制  [b] 编辑  [c] 重新生成\n[d] 翻译  [e] 解释  [f] 优化\n\n# 8. 按 d 翻译\n> d\n```\n\n### 设计哲学\n\n1. **所有操作都是 2 键完成**：`f + 字母` = 任何操作\n2. **永不离开键盘**：不需要鼠标，不需要方向键\n3. **即时反馈**：按 `f` 立即显示所有可能的操作\n4. **无限层级**：可以深度嵌套，每个子菜单都是新的 Hint\n5. **视觉提示**：字母标注清晰，颜色区分状态\n6. **一致体验**：所有界面（对话框、文件浏览器、设置）都使用相同模式\n\n这才是 qutebrowser 的精髓——**按 `f` 后所有可操作元素都有快捷字母，按字母直接操作，形成肌肉记忆后操作极快**。"
