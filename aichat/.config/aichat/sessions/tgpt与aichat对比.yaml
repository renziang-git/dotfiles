  content: "明白了！你想要的是像 **qutebrowser** 那样的 Vim 风格——浏览器本身就是以 Vim 键位为核心操作方式，而不是在传统 Vim 编辑器上做修改。让我重新设计：\n\n## 纯 Vim 风格 AI 聊天终端（qutebrowser 模式）\n\n### 核心理念\n- **整个终端就是 Vim**，不是\"类似 Vim 的编辑器\"\n- **命令栏**（Command Bar）是所有操作的核心入口\n- **按键即命令**，没有普通编辑器的概念\n- **提示/补全**在命令栏中完成\n\n### 界面布局（qutebrowser 风格）\n\n```\n┌──────────────────────────────────────────────────────────────┐\n│ ▲ ◆ ◆ ◆ ◆ ◆ ◆ ◆ ◆ ◆ ◆ ◆ ◆ ◆ ◆ ◆ ◆ ◆ ◆ ◆ ◆ ◆ ◆ ◆ ◆  │ ← 标签栏 (tabs)\n│ [分析项目] [代码审查] [调试帮助] [API文档]                  │\n├──────────────────────────────────────────────────────────────┤\n│                                                             │\n│  ┌─────────────────────────────────────────────────────┐   │\n│  │ 用户: 分析这个 Rust 项目的代码质量                  │   │\n│  │ AI: 我看到这个项目的架构如下...                     │   │\n│  │     - main.rs: 入口文件，使用了 tokio 异步框架      │   │\n│  │     - lib.rs: 核心库，包含...                       │   │\n│  │     - utils/: 工具模块                              │   │\n│  │                                                     │   │\n│  │     [Continue...]                                    │   │\n│  └─────────────────────────────────────────────────────┘   │\n│                                                             │\n│  [INFO] 响应收到 | 模型: deepseek-chat | 角色: 代码助手   │ ← 状态栏\n├──────────────────────────────────────────────────────────────┤\n│ >                                                            │ ← 命令栏 (Command Bar)\n│ 补全: :open :tab :model :role :session :file :help          │\n│ 预输入: :open 文件路径...                                    │\n└──────────────────────────────────────────────────────────────┘\n```\n\n### 核心操作模式（qutebrowser 模式）\n\n#### 1. 命令栏模式（默认模式）\n\n所有操作都在命令栏中输入，就像 qutebrowser 的 `:` 模式：\n\n```\n> :open main.rs              \" 打开文件\n> :tab source/               \" 在新标签打开目录\n> :model gpt-4               \" 切换模型\n> :role code-reviewer        \" 切换角色\n> :session load project1     \" 加载会话\n> :send 分析这个代码          \" 发送消息\n> :search 错误处理            \" 搜索历史\n> :help keybindings          \" 查看快捷键\n> :quit                      \" 退出\n```\n\n#### 2. 快速键模式（类似 qutebrowser 的 hint 模式）\n\n按键直接触发操作，不需要进入命令栏：\n\n| 单键 | 功能 |\n|------|------|\n| `o` | 命令栏：打开文件 |\n| `O` | 在新标签打开文件 |\n| `t` | 命令栏：新标签 |\n| `T` | 新标签并搜索 |\n| `s` | 命令栏：切换到标签 |\n| `S` | 命令栏：搜索历史 |\n| `r` | 重新发送上一条消息 |\n| `R` | 重新生成上一条响应 |\n| `n` | 下一个搜索结果 |\n| `N` | 上一个搜索结果 |\n| `d` | 删除当前消息 |\n| `u` | 撤销上一步 |\n| `y` | 复制当前消息 |\n| `p` | 粘贴 |\n| `q` | 关闭当前标签 |\n| `Q` | 强制退出 |\n| `?` | 显示帮助 |\n\n#### 3. 标签操作（Vim 风格 Tab 管理）\n\n```\n:tab             \" 创建新标签\n:tabclose        \" 关闭当前标签\n:tabonly         \" 关闭其他标签\n:tabnext         \" 下一个标签\n:tabprev         \" 上一个标签\n:tabmove 2       \" 移动到位置 2\n:tab detach      \" 分离标签到新窗口\n\ngt               \" 下一个标签 (同 :tabnext)\ngT               \" 上一个标签 (同 :tabprev)\n<number>gt       \" 跳转到第 N 个标签\n```\n\n#### 4. 搜索模式（类似 Vim 的 `?` 模式）\n\n```\n/错误处理              \" 搜索消息内容\n?错误处理              \" 反向搜索\n:search 并发问题       \" 搜索历史记录\n:search --file 连接池  \" 搜索文件内容\n```\n\n### 文件操作（类 Vim buffer 管理）\n\n```vim\n:open main.rs          \" 打开单个文件\n:open src/*.rs         \" 打开多个文件\n:open src/             \" 打开目录（会列出文件）\n:buffers               \" 查看已打开的文件\n:bnext / :bprev       \" 切换文件\n:bdelete               \" 关闭文件\n\n\" 文件预览（类似 :Explore）\n:explore               \" 文件浏览器模式\n:explore src/          \" 浏览指定目录\n\n\" 在对话中引用文件\n:open main.rs          \" 文件加入对话上下文\n:open --embed main.rs  \" 嵌入文件内容到消息\n:open --url https://... \" 引用 URL\n```\n\n### 对话管理（类 Vim 寄存器/标记）\n\n```vim\n\" 会话管理（类似 Vim 的 session）\n:session list          \" 列出所有会话\n:session save analysis \" 保存为 analysis\n:session load project  \" 加载 project 会话\n:session delete old    \" 删除旧会话\n:session export md     \" 导出为 Markdown\n\n\" 标记/书签（类似 Vim 的 marks）\n:m a                   \" 标记当前位置为 a\n:marks                 \" 查看所有标记\n:'a                    \" 跳转到标记 a\n\n\" 复制/粘贴（类似 Vim 寄存器）\n:reg                   \" 查看寄存器\n:yank a                \" 复制到寄存器 a\n:put a                 \" 粘贴寄存器 a\n:clipboard             \" 管理剪贴板\n```\n\n### 模型/角色操作（类 Vim 配置）\n\n```vim\n\" 快速切换（像 Vim 的 colorscheme）\n:model deepseek-chat    \" 切换到 DeepSeek\n:model gpt-4            \" 切换到 GPT-4\n:model list             \" 列出可用模型\n\n:role default           \" 默认助手\n:role code-reviewer     \" 代码审查\n:role architect         \" 架构师\n:role debugger          \" 调试助手\n:role list              \" 列出所有角色\n:role custom create     \" 创建自定义角色\n\n\" 配置（类似 Vim 的 :set）\n:set auto-context       \" 自动添加上下文\n:set no-auto-context    \" 关闭\n:set model=deepseek     \" 设置默认模型\n:set role=coder         \" 设置默认角色\n:set theme=dark         \" 设置主题\n:set theme=light        \" 切换主题\n:set number             \" 显示行号\n:set relativenumber     \" 相对行号\n:set hlsearch           \" 高亮搜索\n:set incsearch          \" 增量搜索\n```\n\n### 高级功能（qutebrowser 特有的）\n\n#### 1. Hint 模式（快速选择）\n```\n\" 按 f 进入 Hint 模式\nf                     \" 进入 Hint 模式\n                      \" 每个可点击元素显示字母\n                      \" 输入字母选择对应元素\n\n\" 文件选择\nf → 文件列表中每个文件显示字母 → 输入字母选择\nF → 在后台标签打开（类似 qutebrowser 的 F）\n\n\" 消息操作\nf → 每条消息显示字母 → y(复制)/d(删除)/r(引用) \n```\n\n#### 2. 输入模式（类似 qutebrowser 的 insert mode）\n\n命令栏或输入框自动进入，不需要按 `i`：\n\n```vim\n\" 自动在命令栏中处于输入模式\n: / 搜索内容立即开始输入\n\n\" 输入多行消息\n:send                  \" 进入多行输入模式\n|   # 打开编辑器（如 vim）编辑消息\n|   # 保存退出后自动发送\n```\n\n#### 3. 宏/自动化（类似 Vim 的宏录制）\n\n```vim\n:macro record a         \" 开始录制宏到寄存器 a\n:macro stop            \" 停止录制\n:macro play a          \" 播放宏 a\n:macro repeat 5 a      \" 重复宏 a 5次\n\n\" 示例：创建分析宏\n:macro record a\n:send 分析这段代码的架构\n:model deepseek-chat\n:role architect\n:send 检查是否有设计模式\n:macro stop\n```\n\n### 配置文件 (`~/.config/ai-chat/config.py`)\n\n类似于 qutebrowser 的 Python 配置：\n\n```python\n# AI Chat 配置（纯 Vim 风格）\n\nc.model = \"deepseek-chat\"\nc.role = \"code-assistant\"\n\n# 标签配置\nc.tabs.position = \"top\"       # top/bottom\nc.tabs.show = \"always\"        # always/never/multiple\nc.tabs.width = 20\nc.tabs.wrap = True\n\n# 命令栏配置\nc.commands.timeout = 2000     # 命令超时(ms)\nc.commands.completion = True  # 启用补全\nc.commands.history_size = 1000\nc.commands.show_cursor = True\n\n# 键位映射\nconfig.bind('H', 'tab-prev')\nconfig.bind('L', 'tab-next')\nconfig.bind('J', 'move-down')\nconfig.bind('K', 'move-up')\nconfig.bind('d', 'close-tab')\nconfig.bind('u', 'undo')\n\n# 自定义命令\nconfig.command(':docker', '!docker ps')\nconfig.command(':git', '!git status')\nconfig.command(':compile', ':send 编译错误: {clipboard}')\n\n# 高级设置\nc.completion.use_history = True\nc.completion.use_ai = True\nc.search.ignore_case = True\nc.messages.max_history = 10000\n```\n\n### 启动方式\n\n```bash\n# 普通启动\nai-chat\n\n# 指定项目\nai-chat --target /path/to/project\n\n# 从会话恢复\nai-chat --session analysis\n\n# 指定模型和角色\nai-chat --model deepseek-chat --role code-reviewer\n\n# 无头模式（纯命令栏）\nai-chat --headless\n```\n\n### 典型使用流程\n\n```bash\n# 1. 启动\n$ ai-chat --target ./my-project\n\n# 2. 自动进入命令栏\n> :send 分析这个项目的结构\n\n# 3. 查看响应\n# 按 j/k 翻看消息\n\n# 4. 新建标签分析代码\n> :tab\n> :open src/main.rs\n> :send 解释 main 函数的逻辑\n\n# 5. 切换标签\n> gt  # 或 :tabnext\n\n# 6. 搜索历史\n> /错误处理\n\n# 7. 引用文件\n> :open --embed src/lib.rs\n\n# 8. 切换模型\n> :model gpt-4\n\n# 9. 保存会话\n> :session save my-analysis\n\n# 10. 退出\n> :quit\n```\n\n### 与 qutebrowser 的关键区别\n\n| 功能 | qutebrowser | AI Chat |\n|------|-------------|---------|\n| 核心操作 | 浏览网页 | AI 对话 |\n| 标签用途 | 多个网页 | 多个对话 |\n| hint 模式 | 选择链接 | 选择消息/文件 |\n| 命令栏 | 执行命令 | AI 交互 + 命令 |\n| 搜索 | 网页搜索 | 消息/文件搜索 |\n| 书签 | 收藏网址 | 标记对话位置 |\n| :open | 打开网址 | 打开文件/目录 |\n| 配置 | Python | Python |\n\n这个设计完全参考 qutebrowser 的理念：**一切操作通过命令栏和快捷键完成，不需要鼠标，不需要图形界面，纯键盘驱动的 Vim 风格 CLI 工具**。"
