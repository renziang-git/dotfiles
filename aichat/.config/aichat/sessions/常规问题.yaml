  content: |-
    ## `join lines` 在 Neovim/Vim 中的含义

    `J`（大写）在 Normal 模式下表示 **合并行**，其行为：

    ### 具体效果
    - **将当前行的下一行合并到当前行末尾**
    - 在两行之间插入一个空格
    - 光标保持不动

    ### 例子

    ```
    原始文本：                   按 `J` 后：
    第1行内容                   第1行内容 第2行内容
    第2行内容
    第3行内容                   第3行内容
    ```

    ### 你的映射含义
    ```lua
    vim.keymap.set("i", "<C-A-j>", "<C-o>J", { desc = "Join lines" })
    ```
    - **在 Insert 模式下**：按 `Ctrl+Alt+j`
    - 临时回到 Normal 模式（`<C-o>`）
    - 执行 `J` 命令：合并下一行到当前行
    - 自动回到 Insert 模式

    ### 实际操作场景
    假设你有：
    ```
    Hello  ← 光标在这里（Insert 模式）
    World
    ```
    按 `Ctrl+Alt+j` 后变为：
    ```
    Hello World  ← 合并成一行
    ```

    ### 注意
    - `-- Ctrl+Shift+j` 这个注释是**错误的**
    - `J` 就是大写 J，不需要 `Shift+J`（因为已经是 Shift+J 的结果）
    - 正确的注释应该是 `-- Ctrl+Alt+j` 或 `-- Ctrl+Alt+J`
