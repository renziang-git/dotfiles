- role: assistant
  content: "## `<C-A-j>` 被 \"completion\" 占用\n\n**\"completion\"** 指的是 Neovim 内置的 **补全功能**（代码补全、自动补全）。\n\n### 具体是什么？\n\nNeovim 默认的 Insert 模式补全快捷键：\n- `<C-n>` - 向下选择补全项\n- `<C-p>` - 向上选择补全项\n- **`<C-j>`** - 向下选择补全项（部分补全引擎支持）\n- **`<C-k>`** - 向上选择补全项（部分补全引擎支持）\n\n如果你安装了补全插件（如 nvim-cmp、coq.nvim、completion-nvim 等），这些插件**默认会占用**：\n- `<C-j>` - 选择下一个补全项\n- `<C-k>` - 选择上一个补全项\n- `<C-space>` - 触发补全\n- `<CR>` - 确认补全\n\n### 冲突的本质\n\n当你设置 `<C-A-j>` 为翻页时，因为 `<C-A-j>` = `<C-j>` + Alt（有些终端或插件会将 Ctrl+Alt+j 识别为 Ctrl+j），**可能**与补全插件的 `<C-j>` 键产生冲突。\n\n### 解决方案\n\n#### 方案1：修改补全插件的快捷键（推荐）\n**nvim-cmp 示例：**\n```lua\n-- 将补全的上下选择改为其他键，避免冲突\nlocal cmp = require(\"cmp\")\ncmp.setup({\n  mapping = {\n    -- 改用 Tab/Shift+Tab 或 Ctrl+o/Ctrl+i 代替 Ctrl+j/k\n    [\"<Tab>\"] = cmp.mapping.select_next_item(),\n    [\"<S-Tab>\"] = cmp.mapping.select_prev_item(),\n    \n    -- 如果你还是想要 Ctrl+j/k，可以保持，但要理解可能与你的翻页冲突\n    [\"<C-j>\"] = cmp.mapping.select_next_item(),\n    [\"<C-k>\"] = cmp.mapping.select_prev_item(),\n  }\n})\n```\n\n#### 方案2：改变你的翻页快捷键\n```lua\n-- 改为其他无冲突的组合\nvim.keymap.set(\"i\", \"<C-A-d>\", \"<C-o><C-f>\", { desc = \"Page ↓\" })  -- 用之前删除行的键\n-- 或\nvim.keymap.set(\"i\", \"<C-A-n>\", \"<C-o><C-f>\", { desc = \"Page ↓\" })  -- Ctrl+Alt+n\n```\n\n#### 方案3：检查你是否安装了补全插件\n运行 `:Lazy` 或 `:Packer` 或 `:PlugStatus` 查看已安装的插件列表。\n\n### 建议\n\n如果你**使用补全插件**（如 nvim-cmp），推荐：\n\n```lua\n-- 翻页改为：\nvim.keymap.set(\"i\", \"<C-A-d>\", \"<C-o><C-f>\", { desc = \"Page ↓\" })\nvim.keymap.set(\"i\", \"<C-A-e>\", \"<C-o><C-b>\", { desc = \"Page ↑\" })\n\n-- 补全使用 Tab/Shift+Tab 或 Ctrl+o/Ctrl+i\n```\n\n如果你**不使用补全插件**，可以忽略这个提示，`<C-A-j>` 不会有冲突。"
