  content: |-
    根据中国官方历史资料和主流学术界的共识：

    ## 三年自然灾害是指 **1959年—1961年**

    ### 具体年份
    - **1959年** — 开始出现大规模粮食减产
    - **1960年** — 灾害最严重的一年
    - **1961年** — 持续困难，但开始逐步缓解

    ### 主要原因
    1. **自然灾害**：连续三年大面积干旱（部分地区旱灾、水灾、蝗灾）
    2. **农业生产下降**：粮食产量大幅减少
    3. **公共政策因素**：当时的农村政策（大跃进、人民公社化运动）加剧了困难

    ### 官方称谓演变
    - 最初称"三年自然灾害时期"
    - 1981年《关于建国以来党的若干历史问题的决议》改为**"三年经济困难时期"**
    - 现在官方文件中多使用"三年困难时期"或"1959—1961年经济困难时期"

    ### 注意
    - 这三个年份存在 **"1958—1961"** 或 **"1959—1961"** 两种说法
    - 主流学界以 **1959年—1961年** 为准（1958年尚未全面爆发，1962年基本恢复）
