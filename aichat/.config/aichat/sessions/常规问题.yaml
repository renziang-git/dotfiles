    ### 党的历史上的三个重要历史决议

    这三个决议被称为“历史决议”，是中国共产党在重大历史转折关头，对自身历史作出的系统性总结。

    | 决议名称 | 通过时间 | 通过会议 | 核心内容和历史意义 |
    | :--- | :--- | :--- | :--- |
    | **1. 《关于若干历史问题的决议》** | 1945年4月20日 | 中共六届七中全会 | **核心内容**：总结了建党以来，特别是1931年到1935年（遵义会议前）的历史经验，批判了以王明为代表的“左”倾路线错误，高度评价了毛泽东同志运用马列主义解决中国问题的贡献。 **意义**：在抗日战争胜利前夕，统一了全党思想，为党的七大的召开和抗日战争的最后胜利奠定了思想基础。 |
    | **2. 《关于建国以来党的若干历史问题的决议》** | 1981年6月27日 | 中共十一届六中全会 | **核心内容**：系统总结了建国32年以来的历史。最重要的是：<br>1. 肯定了建国后的成就。<br>2. **彻底否定了“文化大革命”**，指出这是一场由领导者错误发动、给党、国家和各族人民带来严重灾难的内乱。<br>3. 客观分析了“大跃进”和“三年经济困难”的原因。<br>4. **确立了毛泽东同志的历史地位**，指出其功绩是第一位的，错误是第二位的，并坚持毛泽东思想。<br>**意义**：在改革开放初期，完成了指导思想上的拨乱反正，为全面改革开放和现代化建设提供了思想基础。 |
    | **3. 《中共中央关于党的百年奋斗重大成就和历史经验的决议》** | 2021年11月11日 | 中共十九届六中全会 | **核心内容**：回顾了党百年奋斗的四个历史时期（新民主主义革命、社会主义革命和建设、改革开放和社会主义现代化建设、中国特色社会主义新时代），总结了13个方面的重大成就，并概括了 **“十个坚持”** 的历史经验（如坚持党的领导、坚持人民至上、坚持理论创新等）。 **意义**：在建党百年之际，统一了全党对百年奋斗历程的认识，特别是对新时代重大成就和历史经验的认识，为开启全面建设社会主义现代化国家新征程提供了行动指南。 |

    ### 它们之间的关系和区别

    - **共同点**：都是党在重大历史节点（1945年胜利前夜、1981年改革开放初期、2021年百年华诞）通过的，旨在总结历史、统一思想、面向未来。
    - **历史跨度不同**：第一个决议主要总结新民主主义革命前期；第二个决议总结建国32年；第三个决议总结党的百年全部历史，尤其侧重新时代。
    - **侧重点不同**：第一个是“分清路线是非”，第二个是“拨乱反正”，第三个是“总结成就和经验”。

