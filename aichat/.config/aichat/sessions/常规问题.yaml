    ## Neovim 撤销撤销（重做/Redo）

    ### 方法

    #### 1. **Normal 模式**
    ```vim
    <C-r>     " 撤销撤销（重做）
    ```
    或
    ```vim
    u         " 撤销
    <C-r>     " 重做（撤销撤销）
    ```

    #### 2. 基于你现在的 Insert 模式映射

    你已经有：
    ```lua
    vim.keymap.set("i", "<C-A-u>", "<C-o>u", { desc = "Undo" })
    ```

    可以添加重做映射：
    ```lua
    vim.keymap.set("i", "<C-A-r>", "<C-o><C-r>", { desc = "Redo（撤销撤销）" })
    ```

    ### 完整的新增映射

    ```lua
    -- 撤销 / 重做
    vim.keymap.set("i", "<C-A-u>", "<C-o>u", { desc = "Undo（撤销）" })
    vim.keymap.set("i", "<C-A-r>", "<C-o><C-r>", { desc = "Redo（撤销撤销）" })
    ```

    ### 使用方式

    1. **撤销**：`Ctrl+Alt+u`
    2. **撤销撤销（重做）**：`Ctrl+Alt+r`

    ### ⚠️ 注意

    `<C-A-r>` 需要确认没有被其他插件占用（比如补全插件的刷新/替换功能）。如果有冲突，可以改为：

    ```lua
    vim.keymap.set("i", "<C-A-y>", "<C-o><C-r>", { desc = "Redo（撤销撤销）" })
    ```

    这样就把 **撤销/重做** 放到相邻的键位上了（`u` 和 `r` 或 `u` 和 `y`）。
