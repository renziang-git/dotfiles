  content: nvim 如何配置多步重做
- role: assistant
  content: |-
    ## Neovim 多步重做配置

    ### 核心问题
    在 Insert 模式下，`<C-o>` 只能执行一个 Normal 命令，所以你的映射：

    ```lua
    vim.keymap.set("i", "<C-A-r>", "<C-o><C-r>", { desc = "Redo" })
    ```

    **只能重做1步**，因为 `<C-o><C-r>` 执行完一次 `<C-r>` 就回到 Insert 模式了。

    ### 解决方案

    #### 方案1：使用 `vim.cmd` + `normal!` 循环

    ```lua
    vim.keymap.set("i", "<C-A-r>", function()
      local count = vim.v.count1  -- 获取 count（比如 3<C-A-r> 就是重做3步）
      if count == 0 then count = 1 end
      for _ = 1, count do
        vim.cmd("normal! <C-r>")
      end
    end, { desc = "Redo 多步" })
    ```

    使用方式：
    - `Ctrl+Alt+r` — 重做1步
    - `3<C-A-r>` — 重做3步（先按 3，再按 Ctrl+Alt+r）
    - `10<C-A-r>` — 重做10步

    #### 方案2：使用 `vim.fn.execute`（另一种写法）

    ```lua
    vim.keymap.set("i", "<C-A-r>", function()
      local count = vim.v.count1
      for _ = 1, count do
        vim.fn.execute("normal! \<C-r>")
      end
    end, { desc = "Redo 多步" })
    ```

    #### 方案3：如果你想要一直按着持续重做（不推荐）

    ```lua
    vim.keymap.set("i", "<C-A-r>", function()
      -- 每次按下只重做1步，需要重复按
      vim.cmd("normal! \<C-r>")
    end, { desc = "Redo 1步" })
    ```

    ### 推荐配置

    ```lua
    -- Insert 模式撤销/重做（支持多步）
    vim.keymap.set("i", "<C-A-u>", function()
      local count = vim.v.count1
      for _ = 1, count do
        vim.cmd("normal! u")
      end
    end, { desc = "Undo 多步" })

    vim.keymap.set("i", "<C-A-r>", function()
      local count = vim.v.count1
      for _ = 1, count do
        vim.cmd("normal! \<C-r>")
      end
    end, { desc = "Redo 多步" })
    ```

    ### 使用示例

    | 操作 | 效果 |
    |------|------|
    | `Ctrl+Alt+u` | 撤销1步 |
    | `Ctrl+Alt+r` | 重做1步 |
    | `5<C-A-u>` | 撤销5步 |
    | `10<C-A-r>` | 重做10步 |
    | `2<C-A-u>`, 然后 `3<C-A-r>` | 先撤销2步，再重做3步 |

    这样你的 Insert 模式就拥有了和 Normal 模式一样灵活的多步撤销/重做功能！
