  content: "好消息！`file` 命令显示它是 **ASCII text** 格式的！这意味着它可能只是 Base64 编码的数据，而不是真正的二进制加密文件。\n\n## 尝试解码\n\n### 第1步：检查是否是 Base64 编码\n\n```fish\n# 查看文件内容\ncat ~/.local/share/net.flclient.app/.secure_storage.dat\n\n# 尝试 Base64 解码\ncat ~/.local/share/net.flclient.app/.secure_storage.dat | base64 -d 2>/dev/null | xxd | head -50\n```\n\n如果 Base64 解码成功，可能会看到 JSON 或 YAML 格式的配置。\n\n### 第2步：如果 Base64 解码失败，尝试 AES 解密\n\nFlutter Secure Storage 默认使用 AES 加密，密钥由 Flutter 生成并存储在：\n```fish\n# 检查 Flutter 密钥存储\nls -la ~/.local/share/net.flclient.app/*.key*\nfind ~ -name \"*.key\" 2>/dev/null\n\n# 检查是否有密钥文件\nfind ~/.local/share/net.flclient.app/ -type f -name \"*key*\"\n```\n\n### 第3步：查看程序内存中的解码数据\n\n在程序运行时，节点配置会被加载到内存中：\n\n```fish\n# 启动程序（后台运行）\ncd ~/Downloads/linux/bundle\n./flclient &\nsleep 2\n\n# 获取 PID\nset PID (pgrep flclient)\n\n# 如果程序崩溃，连续尝试启动\nwhile true\n    ./flclient &\n    sleep 3\n    if pgrep flclient > /dev/null\n        break\n    end\nend\n\nset PID (pgrep flclient)\n\n# 检查内存映射\nsudo cat /proc/$PID/maps 2>/dev/null\n\n# 提取字符串 - 查找代理协议\nsudo strings /proc/$PID/mem 2>/dev/null | grep -E \"(vless|vmess|trojan|ss://|ssr://|server|port|password|uuid)\" | head -30\n```\n\n### 第4步：查看程序使用的密钥\n\n```fish\n# 从 libapp.so 中查找可能的密钥\nstrings lib/libapp.so | grep -i \"key\" | head -20\nstrings lib/libapp.so | grep -E \"^[A-Za-z0-9+/=]{32,}$\" | head -10\n\n# 查找硬编码的加密密钥\nstrings lib/libapp.so | grep -E \"(aes|AES|secret|SECRET|encrypt|decrypt)\" | head -20\n```\n\n### 第5步：尝试直接分析 .secure_storage.dat\n\n```fish\n# 查看文件大小\nwc -c ~/.local/share/net.flclient.app/.secure_storage.dat\n\n# 检查是否是 JSON 格式（有些 Flutter Secure Storage 实现使用简单加密）\ncat ~/.local/share/net.flclient.app/.secure_storage.dat | tr -d '\\n' | python3 -c \"\nimport sys\ndata = sys.stdin.read().strip()\ntry:\n    import json\n    print(json.loads(data))\nexcept:\n    print('Not JSON')\n\"\n```\n\n### 第6步：尝试暴力解码\n\n```fish\n# 尝试多种 Base64 变体\ncat ~/.local/share/net.flclient.app/.secure_storage.dat | base64 -d 2>/dev/null > /tmp/decoded