    以下是完全卸载 FastLink 的方法：

    ## 完全卸载 FastLink

    ### 1. 先停止程序运行

    ```fish
    # 停止进程
    killall flclient 2>/dev/null

    # 确认进程已关闭
    pgrep flclient
    ```

    ### 2. 删除程序文件

    ```fish
    # 删除解压的程序目录（假设在 Downloads 里）
    rm -rf ~/Downloads/linux/bundle
    rm -rf ~/Downloads/fastlink*

    # 删除解压的 tar.gz 文件
    rm -f ~/Downloads/fastlink*.tar.gz
    rm -f ~/Downloads/flclient*.tar.gz
    ```

    ### 3. 删除配置和数据文件

    ```fish
    # 删除应用数据目录（包含 .secure_storage.dat 等）
    rm -rf ~/.local/share/net.flclient.app/

    # 删除可能的缓存目录
    rm -rf ~/.cache/net.flclient.app/
    rm -rf ~/.cache/flclient/

    # 删除配置目录
    rm -rf ~/.config/net.flclient.app/
    rm -rf ~/.config/flclient/
    ```

    ### 4. 检查并删除其他残留

    ```fish
    # 检查是否有其他残留文件
    find ~ -iname "*flclient*" -o -iname "*fastlink*" 2>/dev/null

    # 检查系统级安装（如果有）
    find /usr/local -iname "*flclient*" -o -iname "*fastlink*" 2>/dev/null
    find /opt -iname "*flclient*" -o -iname "*fastlink*" 2>/dev/null

    # 删除找到的残留文件
    # 根据上面的结果手动删除
    ```

    ### 5. 清理系统服务和快捷方式

    ```fish
    # 检查是否有 autostart 条目
    ls ~/.config/autostart/*flclient* 2>/dev/null

    # 检查桌面快捷方式
    ls ~/.local/share/applications/*flclient* 2>/dev/null

    # 如果有，删除它们
    rm -f ~/.config/autostart/*flclient* 2>/dev/null
    rm -f ~/.local/share/applications/*flclient* 2>/dev/null
    ```

    ### 6. 验证完全删除

    ```fish
    # 确认没有残留
    ls ~/.local/share/net.flclient.app/ 2>/dev/null && echo "还有残留" || echo "已清除"
    which flclient 2>/dev/null && echo "还有命令" || echo "已清除"
    ```

    ### 7. 如果还有问题，搜索所有相关文件

    ```fish
    # 全局搜索所有相关文件（需要 sudo）
    sudo find / -iname "*flclient*" -o -iname "*fastlink*" 2>/dev/null

    # 然后根据结果删除
    ```

    **一行命令搞定全部卸载：**
    ```fish
    killall flclient 2>/dev/null; rm -rf ~/Downloads/linux/bundle ~/Downloads/flclient*.tar.gz ~/.local/share/net.flclient.app/ ~/.cache/net.flclient.app/ ~/.config/net.flclient.app/ 2>/dev/null; echo "卸载完成"
    ```

    这个软件是绿色免安装的，所有文件都在你解压的目录和用户目录下，没有系统级安装，所以删除这些就够了。
