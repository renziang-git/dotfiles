l bg = vim.o.background\n      local style = (bg == \"light\") and \"day\" or \"moon\"\n\n      require(\"tokyonight\").setup({\n        style = style,\n      })\n\n      vim.cmd.colorscheme(\"tokyonight\")\n    end\n\n    -- 初次应用\n    apply_theme()\n\n    -- 监听 background 变化（关键）\n    vim.api.nvim_create_autocmd(\"OptionSet\", {\n      pattern = \"background\",\n      callback = apply_theme,\n    })\n  end,\n}\n```\n\n---\n\n## 怎么触发切换？\n\n你只需要：\n\n```vim\n:set background=light\n```\n\n或\n\n```vim\n:set background=dark\n```\n\n👉 就会自动切换：\n\n- light → day  \n- dark → moon  \n\n---\n\n# 二、和系统主题联动（Wayland / Hyprland）\n\n你在用 Linux + 平铺窗口管理器（之前提到过），可以让系统切换时同步：\n\n比如你用脚本切换主题时，加一句：\n\n```bash\nnvim --headless \"+set background=light\" +q\n```\n\n或者用 `gsettings` / 环境变量，再写一个小脚本触发 nvim（进阶玩法）。\n\n---\n\n# 三、手动快捷键切换（更简单）\n\n如果你不想折腾系统联动，可以直接绑定快捷键👇\n\n```lua\nvim.keymap.set(\"n\", \"<leader>td\", function()\n  vim.o.background = \"dark\"\nend, { desc = \"Dark mode\" })\n\nvim.keymap.set(\"n\", \"<leader>tl\", function()\n  vim.o.background = \"light\"\nend, { desc = \"Light mode\" })\n```\n\n---\n\n👉 配合上面的自动逻辑，就会：\n\n- `<leader>td` → moon  \n- `<leader>tl` → day  \n\n---\n\n# 四、为什么这样是“正确方式”\n\n因为：\n\n```text\ncolorscheme ≠ light/dark\nbackground → 控制 light/dark\ncolorscheme → 决定具体风格\n```\n\n---\n\n👉 我们做的是：\n\n> 用 `background` 作为统一入口 → 映射到 tokyonight 的 style\n\n---\n\n# 五、一句话总结\n\n👉 最优方案是：\n\n> **用 `background` 控制明暗，用 autocmd 自动切换 moon/day**\n\n---\n\n如果你愿意再往前一步，我可以帮你👇  \n\n👉 做一个“**全局主题同步**”：  \n（体验会非常统一）\n\n---\n\n# you asked\n\nmessage time: 2026-05-05 15:34:24\n\n这个快捷键配置放到哪里？\n\n---\n\n# chatgpt response\n\n这个问题其实就是在问：**你的“自定义逻辑”应该放在哪一层** 👍  \n\n---\n\n# 一、最推荐的位置（直接用这个）\n\n👉 放到：\n\n```text\n~/.config/nvim/lua/config/keymaps.lua\n```\n\n---\n\n## 然后在 `init.lua` 里确保有：\n\n```lua\nrequire(\"config.keymaps\")\n```\n\n---\n\n👉 这是最清晰的结构：\n\n```text\nlua/\n├── config/\n│   ├── keymaps.lua   ← 放快捷键 ✔\n│   └── lazy.lua\n└── plugins/\n```\n\n---\n\n# 二、直接给你完整写法（可用）\n\n在 `keymaps.lua` 写👇\n\n