  content: |-
    我看到问题了！你的配置中 **同时定义了 `providers` 和 `vendors`**，而且有冲突：

    ```lua
    {
      provider = "deepseek",
      providers = {     -- ❌ 这个和 vendors 冲突
        deepseek = {
          __inherited_from = "openai",
          api_key = "sk-...",  -- ⭐ 这里直接写死了 API key！
          endpoint = "https://api.deepseek.com/v1",
          ...
        }
      },
      vendors = {       -- ❌ 又定义了 vendors
        deepseek = { ... }
      }
    }
    ```

    两个问题：
    1. **`providers` 和 `vendors` 不能同时用**，只会生效一个
    2. **API key 写死了！** 应该用环境变量

    ## 修复方案

    修改 `lua/plugins/init.lua` 中的 avante 配置为：

    ```lua
    {
      "yetone/avante.nvim",
      build = "make",
      dependencies = {
        "nvim-lua/plenary.nvim",
        "MunifTanjim/nui.nvim",
        "nvim-tree/nvim-web-devicons",
        "zbirenbaum/copilot.lua",
        { "HakonHarnes/img-clip.nvim", event = "VeryLazy", opts = { ... } },
        { "MeanderingProgrammer/render-markdown.nvim", ft = { "markdown", "Avante" }, opts = { ... } },
      },
      event = "VeryLazy",
      keys = {
        { "<leader>aa", function() require("avante.api").ask() end, desc = "avante: ask", mode = "n" },
        { "<leader>ac", function() require("avante.api").chat() end, desc = "avante: chat", mode = "n" },
        { "<leader>ae", function() require("avante.api").edit() end, desc = "avante: edit", mode = "n" },
        { "<leader>ar", function() require("avante.api").refresh() end, desc = "avante: refresh", mode = "n" },
      },
      opts = {
        provider = "deepseek",
        ---@type AvanteProvider
        vendors = {
          ---@type AvanteProvider
          deepseek = {
            __inherited_from = "openai",
            endpoint = "https://api.deepseek.com/v1",
            model = "deepseek-chat",
            api_key_name = "DEEPSEEK_API_KEY",  -- ⭐ 用环境变量名
            max_tokens = 4096,
            temperature = 0.7,
          },
        },
        input = {
          provider = "snacks",
          provider_opts = {
            icon = " ",
            title = "Avante",
          },
        },
      },
    }
    ```

    关键改动：
    1. **移除了 `providers`**（只在 providers 或 vendors 中选一个）
    2. **只用 `vendors`**
    3. **`api_key_name = "DEEPSEEK_API_KEY"`** 而不是直接写死 key

    重新加载配置后试试：
    ```vim
    :Lazy reload avante.nvim
    :lua require("avante").setup({})
    ```
