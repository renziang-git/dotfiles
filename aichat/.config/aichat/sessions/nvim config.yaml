- role: assistant
  content: |-
    你说的是 `which-key` 的显示问题？当某个前缀键（比如 `<leader>`）下挂载了多个快捷键时，which-key 会显示类似 `<leader> + 16 keymaps` 的计数。

    **原因**：
    这是由于你的按键映射（keymaps）没有设置 `desc`（描述）字段。which-key 需要 `desc` 来显示具体的快捷键名称，如果没有设置，它只会显示有多少个映射存在。

    **解决方法**：
    在你定义的每个 `<leader>` 快捷键后面加上 `{ desc = "描述文字" }`。例如：

    ```lua
    -- 正确的写法（显示具体名称）
    vim.keymap.set("n", "<leader>ff", builtin.find_files, { desc = "Find files" })
    vim.keymap.set("n", "<leader>fg", builtin.live_grep, { desc = "Live grep" })

    -- 错误的写法（会显示 "a+ 16 keymaps"）
    vim.keymap.set("n", "<leader>ff", builtin.find_files)
    vim.keymap.set("n", "<leader>fg", builtin.live_grep)
    ```

    **检查现有配置**：
    查看你 `lua/plugins/init.lua` 或 `~/.config/nvim/init.lua` 里的快捷键定义，确保每个都有 `desc` 字段。

    如果你需要我帮你检查具体的代码，请贴出你的配置。
