  content: |-
    你贴的是 `lua/plugins/init.lua`，但我之前看到的是你手动在 `lua/config/lazy.lua` 里定义的 `vim.keymap.set` 那些快捷键。

    **问题在于**：你的 `avante.nvim` 配置里**没有定义快捷键的 `desc`**。

    看你的 avante 部分：
    ```lua
    {
      "yetone/avante.nvim",
      build = "make",
      dependencies = { ... },
      event = "VeryLazy",
      keys = { ... },  -- 这里你写了 keys，但没贴具体内容
      opts = { ... },
    }
    ```

    你在 `keys = { ... }` 里写的内容应该类似这样：

    ```lua
    keys = {
      { "<leader>ac", ":AvanteChat<CR>", desc = "Avante Chat" },
      { "<leader>aa", ":AvanteAsk<CR>", desc = "Avante Ask" },
      { "<leader>ae", ":AvanteEdit<CR>", desc = "Avante Edit" },
    }
    ```

    但如果你**没写 `desc`**，或者 `keys` 里面是空的/只有默认值，which-key 就只会显示计数。

    **解决方案**：
    把 avante 的 `keys` 改成带 `desc` 的：

    ```lua
      "yetone/avante.nvim",
      build = "make",
      dependencies = {
        "stevearc/dressing.nvim",
        "nvim-lua/plenary.nvim",
        "MunifTanjim/nui.nvim",
        --- The below is optional, fs.nvim is an updated version of the old filesystem module
        "echasnovski/mini.icons",
        {
          "HakonHarnes/img-clip.nvim",
          event = "VeryLazy",
          opts = {
            default = {
              embed_image_as_base64 = false,
              prompt_for_file_name = false,
              drag_and_drop = { insert_mode = true },
            },
          },
        },
        {
          "MeanderingProgrammer/render-markdown.nvim",
          opts = {
            file_types = { "markdown", "Avante" },
          },
          ft = { "markdown", "Avante" },
        },
      },
      event = "VeryLazy",
      keys = {
        { "<leader>ac", ":AvanteChat<CR>", desc = "Avante Chat" },
        { "<leader>aa", ":AvanteAsk<CR>", desc = "Avante Ask" },
        { "<leader>ae", ":AvanteEdit<CR>", desc = "Avante Edit" },
      },
      opts = { ... }
    ```

    这样 which-key 就能正确显示快捷键名称了。
