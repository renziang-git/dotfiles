    **完整的修改**：把你的 which-key 配置改成：

    ```lua
    -- which-key
    {
      "folke/which-key.nvim",
      event = "VeryLazy",
      opts = {
        spec = {
          { "<leader>a", group = "Avante AI" },
          { "<leader>f", group = "Find/Search" },
          { "<leader>t", group = "Theme" },
        },
      },
    },
