  content: |-
    这两个提示都可以关掉，但做法不同。我来帮你分步处理：

    ---

    ## 一、`lazyredraw` 警告（来自 Noice）

    这个提示的意思是：你在 `init.lua` 或别的地方设置了 `lazyredraw`，但 Noice 要求它**不能长期开启**。

    ### 解决方案：

    在 `~/.config/nvim/init.lua` 里**删掉或注释掉**这行：

    ```lua
    -- vim.o.lazyredraw = true   -- ❌ 删掉这行
    ```

    或者如果你之前没主动设过，那可能是其他插件设的，用这个命令查看谁设的：

    ```vim
    :verbose set lazyredraw?
    ```

    ---

    ## 二、Avante 的 Deprecation 警告

    内容是：

    > DEPRECATED The configuration of openai should be placed in providers.openai.

    ### 解决方案：

    你的 avante 配置需要更新。找到 `lua/plugins/avante.lua`（或类似文件），改成新版格式：

    ```lua
    return {
      "yetone/avante.nvim",
      opts = {
        provider = "deepseek",
        -- 把 openai 相关配置移到 providers.openai 里
        providers = {
          openai = {
            -- 这里放你之前直接写在顶层的 openai 配置
          },
          deepseek = {
            endpoint = "https://api.deepseek.com",
            model = "deepseek-chat",
            api_key = os.getenv("DEEPSEEK_API_KEY"),
            -- 如果你之前设了 extra_request_body
            extra_request_body = {
              thinking = { type = "disabled" },
            },
          },
        },
      },
    }
    ```

    ---

    ## 三、如果你只是想**快速屏蔽这两个提示**（不推荐）

    可以在 `init.lua` 加这两行**静默**，但这样可能掩盖真正的问题：

    ```lua
    -- 不推荐，只是临时安静
    vim.notify = function(msg, ...)
      if msg:match("lazyredraw") or msg:match("DEPRECATED") then
        return
      end
      return vim.notify(msg, ...)
    end
    ```

    ---

    ## 四、最快干净的做法（推荐）

    按上面 **第一部分** 和 **第二部分** 改完后：

