    ## E21: Cannot make changes, 'modifiable' is off 错误

    这个错误发生在 lazy.nvim 执行同步操作时，缓冲区不是可修改状态。常见原因和解决方案：

    ### 解决方案（按顺序尝试）

    **1. 检查并修复 lazy.nvim**
    ```bash
    # 清除缓存
    rm -rf ~/.local/share/nvim/lazy-cache

    # 重新安装插件
    nvim --headless "+Lazy! sync" +qa
    ```

    **2. 检查 locked 文件**
    ```bash
    # 删除锁文件
    rm ~/.config/nvim/lazy-lock.json

    # 重新生成
    nvim +Lazy sync +qa
    ```

    **3. 可能的冲突插件**
    - 检查 `lua/plugins/init.lua` 中是否有 `lazy.nvim` 或 `lazy-lock.json` 相关的配置
    - 确保没有其他插件尝试修改 lazy.nvim 的缓冲区

    **4. 临时绕过方法**
    ```lua
    -- 在 init.lua 或 lazy.lua 中添加
    vim.opt.modifiable = true

    -- 或设置更高优先级
    vim.cmd('setlocal modifiable')
    ```

    ### 如果问题持续

    ```bash
    # 完全重置插件状态
    rm -rf ~/.local/share/nvim/lazy
    rm -rf ~/.local/state/nvim/plugin-cache

    # 重新安装所有插件
    nvim +Lazy sync +qa
    ```

    **最坏情况**：如果仍然报错，注释掉所有插件配置，只保留 lazy.nvim 核心，逐步添加回插件测试哪个导致问题。
