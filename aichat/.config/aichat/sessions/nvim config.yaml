    ## Neovim 多窗口操作（Window Management）

    ### 基础操作

    | 快捷键 | 说明 |
    |--------|------|
    | `<C-w>v` | 垂直分割 |
    | `<C-w>s` | 水平分割 |
    | `<C-w>c` | 关闭当前窗口 |
    | `<C-w>o` | 关闭其他窗口（保留当前） |
    | `<C-w>q` | 退出当前窗口 |

    ### 窗口切换

    | 快捷键 | 说明 |
    |--------|------|
    | `<C-w>h/j/k/l` | 向左/下/上/右切换 |
    | `<C-w>w` | 循环切换 |
    | `<C-w><C-w>` | 同 `<C-w>w` |

    ### 调整大小

    | 快捷键 | 说明 |
    |--------|------|
    | `<C-w>=` | 等宽等高均衡 |
    | `<C-w>_` | 最大化当前窗口高度 |
    | `<C-w>\|` | 最大化当前窗口宽度 |
    | `<C-w>+` | 增加高度（+1） |
    | `<C-w>-` | 减少高度（-1） |
    | `<C-w>>` | 增加宽度（+1） |
    | `<C-w><` | 减少宽度（-1） |

    ### 常用 lua 命令

    ```lua
    -- 设置固定宽度
    vim.o.winwidth = 40

    -- 程序化调整
    vim.cmd('resize 20')       -- 设置高度
    vim.cmd('vertical resize 80')  -- 设置宽度

    -- 相对调整
    local new_width = vim.api.nvim_win_get_width(0) + 10
    vim.api.nvim_win_set_width(0, new_width)
    ```

    ### 推荐的 keymaps 配置

    ```lua
    -- Smart window movement
    vim.keymap.set("n", "<C-h>", "<C-w>h", { desc = "Move to left window" })
    vim.keymap.set("n", "<C-j>", "<C-w>j", { desc = "Move to lower window" })
    vim.keymap.set("n", "<C-k>", "<C-w>k", { desc = "Move to upper window" })
    vim.keymap.set("n", "<C-l>", "<C-w>l", { desc = "Move to right window" })

    -- Resize with arrow keys
    vim.keymap.set("n", "<C-Up>", "<cmd>resize +2<CR>", { desc = "Increase height" })
    vim.keymap.set("n", "<C-Down>", "<cmd>resize -2<CR>", { desc = "Decrease height" })
    vim.keymap.set("n", "<C-Left>", "<cmd>vertical resize -2<CR>", { desc = "Decrease width" })
    vim.keymap.set("n", "<C-Right>", "<cmd>vertical resize +2<CR>", { desc = "Increase width" })

    -- Equalize windows
    vim.keymap.set("n", "<leader>w=", "<C-w>=", { desc = "Equalize windows" })
    ```
