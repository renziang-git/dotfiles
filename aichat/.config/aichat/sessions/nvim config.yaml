  content: |-
    问题很明显了！虽然你在 fish shell 中设置了环境变量，但 **avante.nvim 可能没有正确读取到**。让我们一步步排查：

    ## 1. 首先验证 nvim 是否能读取到环境变量

    在 nvim 中执行：
    ```vim
    :lua print(os.getenv("DEEPSEEK_API_KEY"))
    ```

    如果输出 `nil`，说明 nvim 读取不到环境变量。

    ## 2. 环境变量设置问题排查

    你在 fish shell 中设置的是哪个 scope？

    ```fish
    # 当前 shell 有效（关闭终端就失效）
    set DEEPSEEK_API_KEY "sk-xxx"

    # 当前用户永久有效 ✅
    set -Ux DEEPSEEK_API_KEY "sk-xxx"

    # 当前 shell 及子进程
    set -x DEEPSEEK_API_KEY "sk-xxx"
    ```

    **推荐使用 `set -Ux`（用户级全局变量）**：
    ```fish
    set -Ux DEEPSEEK_API_KEY "sk-f3ea669226******"
    ```

    ## 3. 如果还是不行，试试用文件存储 API key

    在 `~/.config/fish/config.fish` 中添加：
    ```fish
    # 在文件末尾添加
    set -x DEEPSEEK_API_KEY "sk-f3ea669226******"
    ```

    然后重新加载：
    ```fish
    source ~/.config/fish/config.fish
    ```

    ## 4. 终极方案：直接在配置中写入 API key（不推荐但最简单）

    ```lua
    deepseek = {
      __inherited_from = "openai",
      endpoint = "https://api.deepseek.com/v1",
      model = "deepseek-chat",
      api_key = "sk-f3ea669226******",  -- ⭐ 直接写在这里
      max_tokens = 4096,
      temperature = 0.7,
    },
    ```

    ## 5. 验证流程

    ```bash
    # 1. 检查 fish 中是否设置
    echo $DEEPSEEK_API_KEY
    # 应该输出你的 key

    # 2. 打开 nvim 检查
    nvim --headless -c "lua print(os.getenv('DEEPSEEK_API_KEY'))" -c "qa"
    # 如果输出 nil，说明 nvim 读取不到

    # 3. 从 nvim 启动 fish 检查
    nvim --headless -c "lua print(io.popen('echo $DEEPSEEK_API_KEY'):read('*a'))" -c "qa"
    ```

    ## 最可能的解决方案

    如果你是用 **kitty、wezterm 或 tmux** 启动 nvim，环境变量可能没有正确传递。最简单的方法是：

    1. 在 `~/.config/fish/config.fish` 中添加（永久生效）：
    ```fish
    set -x DEEPSEEK_API_KEY "sk-f3ea669226******"
    ```

    2. 完全退出所有终端和 nvim

    3. 重新打开终端，检查：
    ```bash
    echo $DEEPSEEK_API_KEY  # 确认有输出
    ```

    4. 然后打开 nvim，应该就能读取到了
