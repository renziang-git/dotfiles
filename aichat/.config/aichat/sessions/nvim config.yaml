  content: |-
    这个错误是因为 avante.nvim **新版本**已经把 `provider` 改成了必须放在 `vendors` 或 `providers` 里，不能直接在顶层设 `provider = "deepseek"`。

    错误指向的是 `lua/avante/providers/init.lua:162`，说明配置格式不对。

    ---

    ## 解决方案：用新版 avante 配置格式

    用这个**完全正确的配置**替换你的 avante 插件文件（假设在 `lua/plugins/avante.lua`）：

    ```lua
    return {
      "yetone/avante.nvim",
      event = "VeryLazy",
      lazy = false,
      version = false, -- 用最新版
      build = "make",
      opts = {
        provider = "deepseek",  -- 默认用 deepseek
        auto_suggestions_provider = "deepseek",
        deepseek = {
          endpoint = "https://api.deepseek.com",
          model = "deepseek-chat",
          api_key = os.getenv("DEEPSEEK_API_KEY"),
          temperature = 0.7,
          max_tokens = 4096,
          -- 如果需要禁用 thinking
          extra_request_body = {
            thinking = { type = "disabled" },
          },
        },
        -- 这里不要 vendors 块，直接放 provider 级别的配置
      },
      keys = {
        { "<leader>aa", function() require("avante.api").ask() end, desc = "avante: ask" },
        { "<leader>ac", function() require("avante.api").chat() end, desc = "avante: chat" },
        { "<leader>ae", function() require("avante.api").edit() end, desc = "avante: edit" },
        { "<leader>ar", function() require("avante.api").refresh() end, desc = "avante: refresh" },
      },
    }
    ```

    ---

    ## 关键点说明

    | 旧配置（报错） | 新配置（正确） |
    |---|---|
    | `provider = "deepseek"` 在外面 | ✅ 可以保留，但要在下面放同名 block |
    | 没有 `deepseek = { ... }` block | ✅ 必须有一个和 provider 同名的配置块 |
    | 用 `vendors` 或 `providers` 包裹 | ❌ **不要**用，直接在顶层 |

    ---

    ## 如果还报错：完整重置 avante

    1️⃣ 先完全移除 avante 及其数据：

    ```bash
    rm -rf ~/.local/share/nvim/lazy/avante.nvim
    rm -rf ~/.local/state/nvim/avante
    ```

    2️⃣ 然后重新安装：

    ```bash
    nvim --headless "+Lazy sync" +qa
    ```

    3️⃣ 再重新打开 nvim：

    ```bash
    nvim
    ```

    ---

    ## 验证配置是否加载成功

    打开 nvim 后运行：

    ```vim
    :lua print(vim.inspect(require("avante").config))
    ```

    应该能看到 `provider = "deepseek"` 以及 `deepseek` 配置块的内容，而不是报错。

