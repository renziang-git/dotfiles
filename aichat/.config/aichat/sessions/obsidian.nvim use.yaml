/2024-01-20.md`\n2. 记录句子，用 `[[word]]` 标记生词/语法点\n3. 必要时在 `10-Notes` 下创建详细笔记\n\n### 复习时\n\n```\n:ObsidianSearch ace    → 找到所有提到 ace 的笔记\n:ObsidianBacklinks      → 查看当前笔记被哪些笔记引用\n```\n\n### 归档\n\n```\n:ObsidianQuickSwitch    → 快速跳转到任何笔记\n:ObsidianTags           → 查看所有标签\n```\n\n这样既保持了 Daily 笔记的简洁性，又利用了双链的强大功能。你觉得这个方案适合你吗？"
