- role: assistant
  content: "明白了！你使用 `lazy.nvim` 来管理 `obsidian.nvim`。这里是针对你 vault 结构的完整配置：\n\n## lazy.nvim 配置\n\n```lua\n-- ~/.config/nvim/lua/plugins/obsidian.lua\nreturn {\n  \"epwalsh/obsidian.nvim\",\n  version = \"*\",  -- 使用最新稳定版\n  lazy = true,\n  ft = \"markdown\",\n  event = {\n    -- 仅在你的 vault 目录下加载\n    \"BufReadPre \" .. vim.fn.expand(\"~/path/to/your/vault/**.md\"),\n    \"BufNewFile \" .. vim.fn.expand(\"~/path/to/your/vault/**.md\"),\n  },\n  dependencies = {\n    \"nvim-lua/plenary.nvim\",\n    -- 如果你使用 telescope（推荐）\n    \"nvim-telescope/telescope.nvim\",\n    -- 如果你使用 nvim-cmp（推荐）\n    \"hrsh7th/nvim-cmp\",\n  },\n  opts = {\n    workspaces = {\n      {\n        name = \"main\",\n        path = \"~/path/to/your/vault\",\n      },\n    },\n\n    -- 根据你的 vault 结构\n    notes_subdir = \"10-Notes\",\n\n    daily_notes = {\n      folder = \"00-Daily\",\n      date_format = \"%Y-%m-%d\",\n      alias_format = \"%B %-d, %Y\",\n      default_tags = { \"daily\" },\n      template = \"20-Templates/daily.md\",\n    },\n\n    templates = {\n      folder = \"20-Templates\",\n      date_format = \"%Y-%m-%d\",\n      time_format = \"%H:%M\",\n    },\n\n    attachments = {\n      img_folder = \"assets/imgs\",  -- 你的图片文件夹\n    },\n\n    completion = {\n      nvim_cmp = true,\n      min_chars = 2,\n    },\n\n    mappings = {\n      [\"gf\"] = {\n        action = function()\n          return require(\"obsidian\").util.gf_passthrough()\n        end,\n        opts = { noremap = false, expr = true, buffer = true },\n      },\n      [\"<leader>ch\"] = {\n        action = function()\n          return require(\"obsidian\").util.toggle_checkbox()\n        end,\n        opts = { buffer = true },\n      },\n    },\n\n    -- 自定义 note ID 格式\n    note_id_func = function(title)\n      local suffix = \"\"\n      if title ~= nil then\n        suffix = title:gsub(\" \", \"-\"):gsub(\"[^A-Za-z0-9-]\", \"\"):lower()\n      else\n        for _ = 1, 4 do\n          suffix = suffix .. string.char(math.random(65, 90))\n        end\n      end\n      return tostring(os.time()) .. \"-\" .. suffix\n    end,\n\n    -- 首选链接样式\n    preferred_link_style = \"wiki\",\n\n    picker = {\n      name = \"telescope.nvim\",\n      mappings = {\n        new = \"<C-x>\",\n        insert_link = \"<C-l>\",\n      },\n    },\n\n    ui = {\n      enable = true,\n      checkboxes = {\n        [\" \"] = { char = \"󰄱\", hl_group = \"ObsidianTodo\" },\n        [\"x\"] = { char = \"\", hl_group = \"ObsidianDone\" },\n      },\n    },\n  },\n}\n```\n\n## 模板配置\n\n创建 `20-Templates/daily.md`：\n\n```markdown\n---\ntags: [daily/{{date}}]\ncreated: {{date}}\n---\n\n# {{date}}\n\n## 📖 英语学习\n\n### 今日句子\n\n### 生词\n\n### 语法点\n\n## ✅ 任务\n- [ ] \n\n## 💭 想法\n```\n\n创建 `20-Templates/english-note.md`（用于英语笔记）：\n\n```markdown\n---\ntags: [english/{{title}}]\ncreated: {{date}}, {{time}}\naliases: []\n---\n\n# {{title}}\n\n## 原句\n\n## 生词\n\n## 语法点\n\n## 例句\n```\n\n## 常用命令\n\n```vim\n\" 创建新笔记\n:ObsidianNew 文件名\n\n\" 创建今日日记\n:ObsidianToday\n\n\" 基于模板创建\n:ObsidianNewFromTemplate english-note\n\n\" 插入模板到当前笔记\n:ObsidianTemplate\n\n\" 搜索笔记\n:ObsidianSearch 查询\n\n\" 快速切换\n:ObsidianQuickSwitch\n\n\" 查看反向链接\n:ObsidianBacklinks\n```\n\n## 在你的英语笔记工作流中\n\n1. **Daily 笔记** (`00-Daily/2024-01-20.md`):\n```markdown\n---\ntags: [daily/2024-01-20]\n---\n\n## 📖 英语\n\n> I wrote everything [[you need to ace math → something needed]]\n\n### 生词\n- [[ace]] 精通\n- [[whatnot]] 等等\n```\n\n2. **如果需要详细笔记**，在 `10-Notes/English/` 下创建：\n```\n:ObsidianNewFromTemplate english-note\n# 标题：ace\n```\n\n3. **使用双链**连接相关概念：\n```markdown\n- [[ace]] 相关：[[精通级学科词汇]]\n```\n\n这样的配置完全符合你的工作流：Daily 是唯一输入点，用 `[[word]]` 标记，必要时在 `10-Notes` 创建详细笔记。需要我帮你调整某些特定部分吗？"
